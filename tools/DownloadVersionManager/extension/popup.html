<!doctype html><html lang="ko"><meta charset="utf-8"><title>DownloadVersionManager</title>
<link rel="stylesheet" href="popup.css"><body>
<h1>DownloadVersionManager</h1><p id="version"></p>
<p>새 다운로드에 원래 이름을 주고, 다른 내용의 이전 파일만 <strong>_history</strong>에 보관합니다.</p>
<button id="check">설치 연결 확인</button><p id="result" role="status" aria-live="polite"></p>
<p>평가판은 확장을 직접 활성화해야 합니다. 연결 확인이 끝나야 파일 정리가 가능합니다.</p>
<p>오류가 나면 남아 있는 파일을 확인하세요. 사용 중인 파일을 닫거나 앱을 강제로 종료하지 않습니다.</p>
<script src="popup.mjs" type="module"></script></body></html>
