# Inactive template. Use only within an approved temporary CI trial, then remove remote trial data.
name: ImageCopySave direct-menu G0 candidate build
on:
  push:
    branches: [codex/image-copy-save-native-tests]
    paths:
      - 'tools/ImageCopySave/**'
      - '.github/workflows/image-copy-save-native-tests.yml'
permissions:
  contents: read
jobs:
  native-shell:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build native commands and run policy/direct COM tests
        shell: pwsh
        run: ./tools/ImageCopySave/build/build-shell.ps1
      - name: Build and inspect unsigned full MSIX without registration
        shell: powershell
        run: ./tools/ImageCopySave/build/build-package.ps1
      - name: Retain evidence and unsigned evaluation files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-copy-save-native-test-results
          path: |
            artifacts/image-copy-save/native-shell/*.log
            artifacts/image-copy-save/native-shell/*.json
            artifacts/image-copy-save/native-shell/*.dll
            artifacts/image-copy-save/native-shell/*.exe
            artifacts/image-copy-save/package-evaluation/**/*.log
            artifacts/image-copy-save/package-evaluation/package-result.json
            artifacts/image-copy-save/package-evaluation/*.msix
          if-no-files-found: error
          retention-days: 7
