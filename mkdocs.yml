site_name: Workspace · 자료 정리와 업무 안내
site_description: 파일과 메일을 찾기 쉽게 정리하고, 폴더에 진행 상태를 표시하고, 다음 할 일을 확인하는 방법
site_url: https://prozac0401.github.io/Workspace/
exclude_docs: |
  **
  !/index.md
  !/principles.md
  !/getting-started.md
  !/quick-reference.md
  !/policies/workspace.md
  !/policies/kits.md
  !/policies/files-email.md
  !/policies/archive-security.md
  !/policies/decisions.md
  !/policies/folder-workflow.md
  !/policies/work-efficiency.md
  !/tools/folderstate/index.md
  !/tools/folderstate/installation.md
  !/tools/folderstate/troubleshooting.md
  !/tools/excel-list-compare/index.md
  !/assets/extra.css
  !/assets/folderstate.png
  !/assets/handbook/workspace-flow.webp
  !/assets/handbook/work-lifecycle.webp
  !/assets/handbook/quiet-workspace.webp
  !/assets/handbook/focused-folder.webp
  !/assets/handbook/decision-checklist.webp
  !/assets/handbook/work-safety.webp
  # Material theme resources; check-site.py rejects unreviewed docs assets here.
  !/assets/images/favicon.png
  !/assets/stylesheets/**
  !/assets/javascripts/**
theme:
  name: material
  language: ko
  font: false
  icon:
    logo: material/folder-check-outline
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 어두운 화면으로 전환
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 밝은 화면으로 전환
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.suggest
plugins:
  - search:
      lang: [ko, en]
      separator: '[\s\-·/]+'
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
extra_css:
  - assets/extra.css
nav:
  - 시작:
      - 안내 첫 화면: index.md
      - 지금 할 일 찾기: quick-reference.md
      - 자료 정리의 10가지 습관: principles.md
      - 업무 하나로 시작하기: getting-started.md
      - 회사에서 정할 항목: policies/decisions.md
  - 자료와 업무 정리:
      - 자료를 둘 곳 정하기: policies/workspace.md
      - 반복 업무 시작과 일정 관리: policies/kits.md
      - 파일 이름과 메일 정리: policies/files-email.md
      - 끝난 업무 보관과 자료 보호: policies/archive-security.md
  - 프로그램 받기:
      - FolderState 설치·업데이트·제거: tools/folderstate/installation.md
      - FolderState 사용하기: tools/folderstate/index.md
      - FolderState 문제 해결: tools/folderstate/troubleshooting.md
      - Excel 명단 비교 설치·사용: tools/excel-list-compare/index.md
  - 불편할 때 더 살펴보기:
      - 반복되는 불편 줄이기: policies/work-efficiency.md
      - 일을 이어서 하고 다른 사람에게 넘기기: policies/folder-workflow.md
validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
