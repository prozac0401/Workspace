site_name: Workspace · 업무 운영 기준
site_description: 정리가 일이 되지 않는 업무 기준 — 빠른 판단, 최소 도입, 폴더·이메일 운영과 FolderState
site_url: https://prozac0401.github.io/Workspace/
exclude_docs: |
  **
  !/index.md
  !/getting-started.md
  !/quick-reference.md
  !/policies/workspace.md
  !/policies/kits.md
  !/policies/files-email.md
  !/policies/archive-security.md
  !/policies/decisions.md
  !/policies/folder-workflow.md
  !/tools/folderstate/index.md
  !/tools/folderstate/installation.md
  !/tools/folderstate/troubleshooting.md
  !/assets/extra.css
  !/assets/folderstate.png
  # Material theme resources; check-site.py rejects unreviewed docs assets here.
  !/assets/images/favicon.png
  !/assets/stylesheets/**
  !/assets/javascripts/**
theme:
  name: material
  language: ko
  font: false
  icon:
    logo: material/folder-check-outline
  palette:
    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-night
        name: 어두운 화면으로 전환
    - scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 밝은 화면으로 전환
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.suggest
plugins:
  - search:
      lang: [ko, en]
      separator: '[\s\-·/]+'
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
extra_css:
  - assets/extra.css
nav:
  - 시작:
      - 운영 기준 안내: index.md
      - 빠른 판단 기준: quick-reference.md
      - 도입 순서: getting-started.md
      - 결정이 필요한 항목: policies/decisions.md
  - 기본 운영:
      - 기본 구조와 원본: policies/workspace.md
      - 업무 키트와 일정: policies/kits.md
      - 파일과 이메일: policies/files-email.md
      - 보관·보안·백업: policies/archive-security.md
  - FolderState:
      - 사용 안내: tools/folderstate/index.md
      - 설치·제거·업그레이드: tools/folderstate/installation.md
      - 명령줄과 오류 해결: tools/folderstate/troubleshooting.md
  - 운영 개선 (선택):
      - 진행·인수인계 개선안: policies/folder-workflow.md
validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
