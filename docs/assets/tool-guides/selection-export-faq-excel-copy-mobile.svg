<svg xmlns="http://www.w3.org/2000/svg" width="360" height="432" viewBox="0 0 360 432" role="img" aria-labelledby="title desc">
<title id="title">시트 탭 자체를 별도 파일로 저장하는 기능은 Excel에도 있나요?</title><desc id="desc">Excel 기본 이동/복사는 시트 전체를 복사합니다. 원본을 남기려면 복사본 만들기를 체크하세요.</desc>
