<text x="135" y="35" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">탭에서 이동/복사</text>
<text x="135" y="60" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">시트 탭을 우클릭</text>
<text x="135" y="80" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">Excel 기본 메뉴 사용</text>
