<text x="120.0" y="155" font-size="18" fill="#283f43" font-weight="700" text-anchor="middle">안내와 코드 확인</text>
<text x="120.0" y="182" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">화면 안내 읽기</text>
<text x="120.0" y="205" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">작업 기록의 오류 코드</text>
