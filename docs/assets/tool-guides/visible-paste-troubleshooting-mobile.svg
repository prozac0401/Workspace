<svg xmlns="http://www.w3.org/2000/svg" width="320" height="432" viewBox="0 0 320 432" role="img" aria-labelledby="title desc">
<title id="title">막혔을 때</title><desc id="desc">안내 문구에 맞춰 선택 범위와 복사한 내용을 확인하세요. 문의할 때는 선택한 범위와 안내 문구를 적어 주세요.</desc>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif">
<rect width="320" height="432" rx="4" fill="#fffdf9"/>
<g transform="translate(9 19) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="28" y="5" width="96" height="86" rx="6" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M43 21H94" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 40H94" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="49" width="84" height="19" rx="3" fill="#ece5d7" stroke="#ece5d7" stroke-width="2"/><path d="M43 60H94" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 79H94" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 60L10 84L18 78L24 90L31 86L24 74L35 72Z" fill="#fffdf9" stroke="#2c2622" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">메뉴가 없으면</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">Excel 종료·다시 실행</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">추가 기능 차단 여부 확인</text>
<path d="M18 144H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="22" y="9" width="100" height="78" rx="4" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M23 28H121M49 10V86M89 10V86M23 47H121M23 66H121" fill="none" stroke="#ded2c4" stroke-width="2"/><rect x="24" y="11" width="96" height="15" rx="2" fill="#ece5d7"/><path d="M49 48H120V65H49Z" fill="#f6e7cd" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="69" y="43" font-size="13" fill="#2c2622" font-weight="400" text-anchor="middle">A</text><text x="104" y="43" font-size="13" fill="#2c2622" font-weight="400" text-anchor="middle">3</text><text x="69" y="62" font-size="13" fill="#2c2622" font-weight="400" text-anchor="middle">B</text><text x="104" y="62" font-size="13" fill="#2c2622" font-weight="400" text-anchor="middle">1</text><text x="69" y="81" font-size="13" fill="#2c2622" font-weight="400" text-anchor="middle">C</text><text x="104" y="81" font-size="13" fill="#2c2622" font-weight="400" text-anchor="middle">2</text></g>
<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">개수가 다르면</text>
<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">빈칸 포함 원본 개수 확인</text>
<text x="120" y="224" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">보이는 대상 개수와 대조</text>
<path d="M18 288H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><circle cx="72" cy="49" r="38" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M94 51A23 23 0 1 1 65 28M65 28L55 27M65 28L60 39" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="323" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">되돌리기가 안 되면</text>
<text x="120" y="348" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">선택·편집·정렬 상태 확인</text>
<text x="120" y="368" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">기존 정렬 설정도 확인</text>
</g></svg>
