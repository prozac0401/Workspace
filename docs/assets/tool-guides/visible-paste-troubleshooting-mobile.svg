<svg xmlns="http://www.w3.org/2000/svg" width="360" height="432" viewBox="0 0 360 432" role="img" aria-labelledby="title desc">
<title id="title">막혔을 때</title><desc id="desc">안내 문구에 맞춰 선택 범위와 복사한 내용을 확인하세요. 문의할 때 이름·명단·수식·업무 파일을 공개하지 마세요.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="360" height="432" rx="12" fill="#fffcf7"/>
<g transform="translate(9 19) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="28" y="5" width="96" height="86" rx="6" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M43 21H94" fill="none" stroke="#55676b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 40H94" fill="none" stroke="#55676b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="49" width="84" height="19" rx="3" fill="#dcece7" stroke="#dcece7" stroke-width="2"/><path d="M43 60H94" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 79H94" fill="none" stroke="#55676b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 60L10 84L18 78L24 90L31 86L24 74L35 72Z" fill="#fff" stroke="#283f43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="35" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">메뉴가 없으면</text>
<text x="135" y="60" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">Excel 종료·다시 실행</text>
<text x="135" y="80" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">추가 기능 차단 여부 확인</text>
<path d="M18 144H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="22" y="9" width="100" height="78" rx="4" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M23 28H121M49 10V86M89 10V86M23 47H121M23 66H121" fill="none" stroke="#d6e0dc" stroke-width="2"/><rect x="24" y="11" width="96" height="15" rx="2" fill="#dcece7"/><path d="M49 48H120V65H49Z" fill="#f6e7cd" stroke="#be8740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="69" y="43" font-size="13" fill="#283f43" font-weight="400" text-anchor="middle">A</text><text x="104" y="43" font-size="13" fill="#283f43" font-weight="400" text-anchor="middle">3</text><text x="69" y="62" font-size="13" fill="#283f43" font-weight="400" text-anchor="middle">B</text><text x="104" y="62" font-size="13" fill="#283f43" font-weight="400" text-anchor="middle">1</text><text x="69" y="81" font-size="13" fill="#283f43" font-weight="400" text-anchor="middle">C</text><text x="104" y="81" font-size="13" fill="#283f43" font-weight="400" text-anchor="middle">2</text></g>
<text x="135" y="179" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">개수가 다르면</text>
<text x="135" y="204" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">빈칸 포함 원본 개수 확인</text>
<text x="135" y="224" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">보이는 대상 개수와 대조</text>
<path d="M18 288H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><circle cx="72" cy="49" r="38" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M94 51A23 23 0 1 1 65 28M65 28L55 27M65 28L60 39" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="323" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">되돌리기가 안 되면</text>
<text x="135" y="348" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">선택·편집·정렬 상태 확인</text>
<text x="135" y="368" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">기존 정렬 설정도 확인</text>
</g></svg>
