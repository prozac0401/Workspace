<text x="360.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">감시할 폴더 선택</text>
<text x="360.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">다운로드 위치 또는 직접 선택</text>
