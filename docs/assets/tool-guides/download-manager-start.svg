<text x="120.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">Windows가 요청하면</text>
<text x="120.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">관리자 승인을 직접 확인</text>
