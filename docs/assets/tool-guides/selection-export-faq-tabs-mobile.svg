<title id="title">여러 시트 탭을 선택해도 새 파일로 만들어 주나요?</title><desc id="desc">이 도구는 한 시트의 선택 범위를 새 시트 하나로 만듭니다. 여러 시트 탭을 함께 선택하면 중단합니다.</desc>
