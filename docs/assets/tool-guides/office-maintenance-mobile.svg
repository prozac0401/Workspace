<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">설정 다시 확인</text>
<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">행·경로 확인 후 분석</text>
