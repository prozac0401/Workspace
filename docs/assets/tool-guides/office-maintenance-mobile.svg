<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">기존 실행을 종료</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">ZIP은 새 폴더에 풀기</text>
<path d="M18 144H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
