<text x="120" y="368" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">첫 목록에 2개 더 많음</text>
<text x="62" y="405" font-size="12" fill="#8a622f" font-weight="700" text-anchor="middle">+2</text>
</g></svg>
