<svg xmlns="http://www.w3.org/2000/svg" width="320" height="432" viewBox="0 0 320 432" role="img" aria-labelledby="title desc">
<title id="title">차이 결과 읽기</title><desc id="desc">차이 결과는 값별 개수 차이를 보여줍니다. 원본 값과 셀 위치는 예시 하나이며, 그 셀이 잘못됐다는 뜻은 아닙니다.</desc>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif">
<rect width="320" height="432" rx="4" fill="#fffdf9"/>
<g transform="translate(9 19) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="22" y="9" width="100" height="78" rx="4" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M23 28H121M49 10V86M89 10V86M23 47H121M23 66H121" fill="none" stroke="#ded2c4" stroke-width="2"/><rect x="24" y="11" width="96" height="15" rx="2" fill="#ece5d7"/><text x="36" y="43" font-size="11" fill="#6e6258" font-weight="400" text-anchor="middle">1</text><rect x="51" y="30" width="36" height="17" rx="2" fill="#ece5d7" stroke="#ece5d7" stroke-width="2"/><text x="69" y="43" font-size="13" fill="#2c2622" font-weight="700" text-anchor="middle">A</text><text x="36" y="62" font-size="11" fill="#6e6258" font-weight="400" text-anchor="middle">2</text><rect x="51" y="49" width="36" height="17" rx="2" fill="#ece5d7" stroke="#ece5d7" stroke-width="2"/><text x="69" y="62" font-size="13" fill="#2c2622" font-weight="700" text-anchor="middle">A</text><text x="36" y="81" font-size="11" fill="#6e6258" font-weight="400" text-anchor="middle">3</text><rect x="51" y="68" width="36" height="17" rx="2" fill="#ece5d7" stroke="#ece5d7" stroke-width="2"/><text x="69" y="81" font-size="13" fill="#2c2622" font-weight="700" text-anchor="middle">A</text></g>
<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">첫 목록</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">같은 비교값 A가</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">3개 들어 있음</text>
<text x="62" y="117" font-size="12" fill="#8a622f" font-weight="700" text-anchor="middle">3</text>
<path d="M18 144H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="22" y="9" width="100" height="78" rx="4" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M23 28H121M49 10V86M89 10V86M23 47H121M23 66H121" fill="none" stroke="#ded2c4" stroke-width="2"/><rect x="24" y="11" width="96" height="15" rx="2" fill="#ece5d7"/><text x="36" y="43" font-size="11" fill="#6e6258" font-weight="400" text-anchor="middle">1</text><rect x="51" y="30" width="36" height="17" rx="2" fill="#ece5d7" stroke="#ece5d7" stroke-width="2"/><text x="69" y="43" font-size="13" fill="#2c2622" font-weight="700" text-anchor="middle">A</text><text x="36" y="62" font-size="11" fill="#6e6258" font-weight="400" text-anchor="middle">2</text><text x="36" y="81" font-size="11" fill="#6e6258" font-weight="400" text-anchor="middle">3</text></g>
<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">둘째 목록</text>
<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">같은 비교값 A가</text>
<text x="120" y="224" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">1개 들어 있음</text>
<text x="62" y="261" font-size="12" fill="#8a622f" font-weight="700" text-anchor="middle">1</text>
<path d="M18 288H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
