<svg xmlns="http://www.w3.org/2000/svg" width="360" height="432" viewBox="0 0 360 432" role="img" aria-labelledby="title desc">
<title id="title">복사한 이미지를 PNG로 저장하기</title><desc id="desc">이전 방식의 메뉴가 바로 열리는 PC에서는 복사한 그림 저장을 바로 고릅니다. 메뉴 표시 설정을 바꿀 필요 없이 같은 폴더에 PNG를 저장합니다.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="360" height="432" rx="12" fill="#fffcf7"/>
<g transform="translate(9 19) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="31" y="9" width="83" height="80" rx="7" fill="#fff" stroke="#277a73" stroke-width="2"/><rect x="55" y="4" width="36" height="14" rx="4" fill="#eef4f1" stroke="#277a73" stroke-width="2"/><rect x="40" y="28" width="65" height="48" rx="3" fill="#eaf0fb" stroke="#d6e0dc" stroke-width="2"/><circle cx="87" cy="40" r="5" fill="#f4dfb7" stroke="#be8740" stroke-width="2"/><path d="M43 71L60 49L74 63L83 56L103 73Z" fill="#dcece7" stroke="#277a73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="35" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">이미지 복사</text>
<text x="135" y="60" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">캡처·그림 앱에서 복사</text>
<text x="135" y="80" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">파일 이름 복사와 구분</text>
<path d="M335 123V137M330 132L335 137L340 132" fill="none" stroke="#277a73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M18 144H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="28" y="5" width="96" height="86" rx="6" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M43 21H94" fill="none" stroke="#55676b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 40H94" fill="none" stroke="#55676b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="49" width="84" height="19" rx="3" fill="#dcece7" stroke="#dcece7" stroke-width="2"/><path d="M43 60H94" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 79H94" fill="none" stroke="#55676b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 60L10 84L18 78L24 90L31 86L24 74L35 72Z" fill="#fff" stroke="#283f43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="179" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">폴더 빈 곳 우클릭</text>
<text x="135" y="204" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">더 많은 옵션 표시에서</text>
<text x="135" y="224" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">복사한 그림 저장 선택</text>
<path d="M335 267V281M330 276L335 281L340 276" fill="none" stroke="#277a73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M18 288H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="18" y="15" width="110" height="70" rx="6" fill="#eaf0fb" stroke="#277a73" stroke-width="2"/><circle cx="103" cy="33" r="8" fill="#f4dfb7" stroke="#be8740" stroke-width="2"/><path d="M24 78L54 36L80 66L95 49L122 79Z" fill="#dcece7" stroke="#277a73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="323" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">같은 폴더에 PNG</text>
<text x="135" y="348" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">이름이 겹치면 번호 추가</text>
<text x="135" y="368" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">기존 파일·복사 내용 유지</text>
</g></svg>
