<path d="M18 288H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><circle cx="72" cy="49" r="38" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M72 23V50L90 61" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="323" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">내보낸 값은 고정</text>
<text x="120" y="348" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">원본이 나중에 바뀌어도</text>
<text x="120" y="368" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">결과는 자동 변경 안 됨</text>
