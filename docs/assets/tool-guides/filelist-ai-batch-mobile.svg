<svg xmlns="http://www.w3.org/2000/svg" width="320" height="432" viewBox="0 0 320 432" role="img" aria-labelledby="title desc">
<title id="title">확정한 목록으로 BATCH 복사 스크립트 요청하기</title><desc id="desc">BATCH 스크립트는 별도로 요청하는 작업입니다. 확정한 파일만 처리하고, 원본 변경·기존 파일 덮어쓰기 없이 미리보기와 시험부터 진행합니다.</desc>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif">
<rect width="320" height="432" rx="4" fill="#fffdf9"/>
<text x="27" y="18" font-size="10" fill="#8a622f" font-weight="700" text-anchor="middle">01</text>
<g transform="translate(9 19) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="15" y="12" width="115" height="72" rx="6" fill="#2c2622" stroke="#2c2622" stroke-width="2"/><path d="M29 30L38 37L29 44" fill="none" stroke="#e3c799" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 37H90M29 57H104M29 69H73" fill="none" stroke="#e3c799" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">확정 목록으로 요청</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">원본 밖의 새 대상 폴더</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">기본 실행은 복사 미리보기</text>
<path d="M300 123V137M295 132L300 137L305 132" fill="none" stroke="#8a622f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="27" y="162" font-size="10" fill="#8a622f" font-weight="700" text-anchor="middle">02</text>
<path d="M18 144H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><circle cx="62" cy="42" r="29" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M84 65L111 90" fill="none" stroke="#8a622f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 36H76M48 46H66" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">계획 대조·소량 시험</text>
