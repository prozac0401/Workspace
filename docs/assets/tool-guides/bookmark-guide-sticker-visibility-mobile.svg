<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">하나라도 보이면</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">Ctrl+Alt+J → 모두 숨김</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">일부만 숨긴 상태도 같음</text>
