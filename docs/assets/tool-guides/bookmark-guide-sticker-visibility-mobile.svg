<text x="120" y="323" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">항상 모두 표시</text>
<text x="120" y="348" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">트레이 → 책갈피 보기</text>
<text x="120" y="368" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">아이콘 두 번 눌러도 표시</text>
