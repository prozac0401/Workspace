<svg xmlns="http://www.w3.org/2000/svg" width="320" height="432" viewBox="0 0 320 432" role="img" aria-labelledby="title desc">
<title id="title">스티커를 모두 숨기고 다시 표시하기</title><desc id="desc">스티커 모드의 보기 단축키는 전체 표시·숨기기를 바꿉니다. 일부만 숨긴 상태에서 누르면 나머지도 숨깁니다. 트레이의 책갈피 보기와 아이콘 두 번 누르기는 항상 전체를 표시합니다.</desc>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif">
<rect width="320" height="432" rx="4" fill="#fffdf9"/>
