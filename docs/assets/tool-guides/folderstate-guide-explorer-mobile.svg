<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">폴더 하나 우클릭</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">업무 폴더 선택</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">더 많은 옵션 표시</text>
