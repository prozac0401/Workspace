<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">업무 상태 열기</text>
<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">상황에 맞는 상태 선택</text>
