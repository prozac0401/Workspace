<svg xmlns="http://www.w3.org/2000/svg" width="320" height="432" viewBox="0 0 320 432" role="img" aria-labelledby="title desc">
<title id="title">문제가 생겼을 때</title><desc id="desc">열기 요청 알림이 나오더라도 실제 열린 화면을 확인하세요. 문의할 때는 버전·실행 순서·알림을 정리하고 업무 내용이 든 데이터와 백업은 보호합니다.</desc>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif">
<rect width="320" height="432" rx="4" fill="#fffdf9"/>
<text x="27" y="18" font-size="10" fill="#8a622f" font-weight="700" text-anchor="middle">01</text>
<g transform="translate(9 19) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><circle cx="62" cy="42" r="29" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M84 65L111 90" fill="none" stroke="#8a622f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 36H76M48 46H66" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">증상과 안내 확인</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">아래 문제 해결 표 확인</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">실행 중인 버전도 확인</text>
<path d="M300 123V137M295 132L300 137L305 132" fill="none" stroke="#8a622f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="27" y="162" font-size="10" fill="#8a622f" font-weight="700" text-anchor="middle">02</text>
<path d="M18 144H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><circle cx="72" cy="49" r="38" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M94 51A23 23 0 1 1 65 28M65 28L55 27M65 28L60 39" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">대상 화면 재확인</text>
<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">창·문서·로그인 상태 확인</text>
<text x="120" y="224" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">진행 중 요청은 중단 가능</text>
<path d="M300 267V281M295 276L300 281L305 276" fill="none" stroke="#8a622f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="27" y="306" font-size="10" fill="#8a622f" font-weight="700" text-anchor="middle">03</text>
<path d="M18 288H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><path d="M72 8L112 24V49Q112 75 72 91Q32 75 32 49V24Z" fill="#ece5d7" stroke="#8a622f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="43" width="34" height="26" rx="4" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M62 43V33Q72 18 82 33V43" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="323" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">필요한 정보만 전달</text>
<text x="120" y="348" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">버전·순서·알림 문구</text>
<text x="120" y="368" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">업무 기록은 그대로 공개</text>
<text x="120" y="388" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">안 함</text>
