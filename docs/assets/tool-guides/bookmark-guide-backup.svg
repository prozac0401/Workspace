<text x="120.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">저장하고 종료</text>
<text x="120.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">메모장 복원 파일 저장·닫기</text>
<text x="120.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">업무 책갈피도 종료</text>
