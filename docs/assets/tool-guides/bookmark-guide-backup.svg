<text x="360.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">데이터 폴더 전체 복사</text>
<text x="360.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">Office 원본은 별도 백업</text>
