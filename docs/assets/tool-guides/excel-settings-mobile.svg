<svg xmlns="http://www.w3.org/2000/svg" width="320" height="432" viewBox="0 0 320 432" role="img" aria-labelledby="title desc">
<title id="title">비교 설정 바꾸기</title><desc id="desc">처음에는 세 설정 모두 꺼져 있습니다. 메일·대소문자 기준을 바꾸려면 첫 목록을 비운 뒤 설정하고 다시 담으세요.</desc>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif">
<rect width="320" height="432" rx="4" fill="#fffdf9"/>
<g transform="translate(9 19) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="36" y="15" width="76" height="73" rx="5" fill="#f7edda" stroke="#b7894e" stroke-width="2"/><path d="M50 34H94" fill="none" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 46H94" fill="none" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 58H82" fill="none" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 70H91" fill="none" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M104 88L112 79H104Z" fill="#ead7b9" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">메일 전체 주소 비교</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">끄면 @ 앞부분만</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">켜면 전체 주소 비교</text>
<text x="62" y="117" font-size="12" fill="#8a622f" font-weight="700" text-anchor="middle">@</text>
<path d="M18 144H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><path d="M27 24H119" fill="none" stroke="#ded2c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="53" cy="24" r="9" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M27 49H119" fill="none" stroke="#ded2c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="93" cy="49" r="9" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M27 74H119" fill="none" stroke="#ded2c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="65" cy="74" r="9" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/></g>
<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">대소문자 무시</text>
<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">끄면 ABC ≠ abc</text>
<text x="120" y="224" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">켜면 ABC = abc</text>
<text x="62" y="261" font-size="12" fill="#8a622f" font-weight="700" text-anchor="middle">Aa</text>
<path d="M18 288H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="24" y="7" width="78" height="70" rx="5" fill="#f2e9dd" stroke="#ded2c4" stroke-width="2"/><rect x="36" y="15" width="76" height="73" rx="5" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M50 34H94" fill="none" stroke="#6e6258" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 46H94" fill="none" stroke="#6e6258" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 58H82" fill="none" stroke="#6e6258" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 70H91" fill="none" stroke="#6e6258" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="109" cy="74" r="17" fill="#f2e9dd" stroke="#8a622f" stroke-width="2"/><path d="M109 64V75L117 79" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="323" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">비교 후 첫 목록 유지</text>
<text x="120" y="348" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">끄면 성공 후 비우기</text>
<text x="120" y="368" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">켜면 다음 비교에 재사용</text>
</g></svg>
