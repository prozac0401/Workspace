<g transform="translate(9 307) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><path d="M42 29L47 86H97L102 29M36 28H108M57 27V16H87V27M61 42V72M83 42V72" fill="#eef4f1" stroke="#55676b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="323" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">프로그램 제거</text>
<text x="135" y="348" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">상태 삭제는 제거 전에</text>
<text x="135" y="368" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">업무 폴더와 파일 유지</text>
