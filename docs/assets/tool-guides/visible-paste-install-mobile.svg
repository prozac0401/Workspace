<text x="120" y="323" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">우클릭 메뉴 확인</text>
<text x="120" y="348" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">Excel을 다시 실행</text>
<text x="120" y="368" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">붙여넣기·되돌리기 메뉴</text>
<text x="62" y="405" font-size="12" fill="#8a622f" font-weight="700" text-anchor="middle">3</text>
</g></svg>
