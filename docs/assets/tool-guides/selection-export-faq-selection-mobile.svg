<svg xmlns="http://www.w3.org/2000/svg" width="360" height="288" viewBox="0 0 360 288" role="img" aria-labelledby="title desc">
<title id="title">떨어진 칸들을 Ctrl로 고르거나 전체 행·열을 선택해도 되나요?</title><desc id="desc">필요한 칸만 이어진 네모 모양으로 선택하세요. 숨기지 않은 칸을 따로 골라 둘 필요는 없습니다.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="360" height="288" rx="12" fill="#fffcf7"/>
<g transform="translate(9 19) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="22" y="9" width="100" height="78" rx="4" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M23 28H121M49 10V86M89 10V86M23 47H121M23 66H121" fill="none" stroke="#d6e0dc" stroke-width="2"/><rect x="24" y="11" width="96" height="15" rx="2" fill="#dcece7"/><rect x="50" y="29" width="38" height="18" rx="1" fill="#dcece7" stroke="#277a73" stroke-width="2"/><text x="68" y="43" font-size="12" fill="#277a73" font-weight="700" text-anchor="middle">A1</text><path d="M56 56H80M56 75H76" fill="none" stroke="#55676b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="35" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">이어진 범위 하나</text>
<text x="135" y="60" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">한 칸이나 네모 범위</text>
<text x="135" y="80" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">필터·숨김이 있어도 가능</text>
<path d="M18 144H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><circle cx="72" cy="49" r="38" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M61 33V65M83 33V65" fill="none" stroke="#be8740" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="179" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">다시 골라야 할 범위</text>
<text x="135" y="204" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">Ctrl로 고른 여러 범위</text>
<text x="135" y="224" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">전체 행·열·시트 선택</text>
</g></svg>
