<svg xmlns="http://www.w3.org/2000/svg" width="720" height="244" viewBox="0 0 720 244" role="img" aria-labelledby="title desc">
<title id="title">원본의 수식이나 필터가 바뀌나요?</title><desc id="desc">원본을 자동 저장하거나 바꾸지 않도록 만들었습니다. 중요한 편집은 먼저 저장하고 결과를 확인하세요.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="720" height="244" rx="12" fill="#fffcf7"/>
<g transform="translate(108 25)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><path d="M72 8L112 24V49Q112 75 72 91Q32 75 32 49V24Z" fill="#dcece7" stroke="#277a73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="43" width="34" height="26" rx="4" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M62 43V33Q72 18 82 33V43" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="180.0" y="155" font-size="18" fill="#283f43" font-weight="700" text-anchor="middle">원본 상태 유지</text>
<text x="180.0" y="182" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">값·수식·기본 모양</text>
<text x="180.0" y="205" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">필터·숨김 상태 유지</text>
<path d="M360 29V212" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(468 25)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="36" y="15" width="76" height="73" rx="5" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M50 34H94" fill="none" stroke="#55676b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 46H94" fill="none" stroke="#55676b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 58H82" fill="none" stroke="#55676b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 70H91" fill="none" stroke="#55676b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="540.0" y="155" font-size="18" fill="#283f43" font-weight="700" text-anchor="middle">결과는 별도 파일</text>
<text x="540.0" y="182" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">내보낸 현재 값 보관</text>
<text x="540.0" y="205" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">원본과 자동 연결 안 됨</text>
</g></svg>
