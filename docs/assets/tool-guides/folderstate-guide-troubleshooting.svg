<text x="600.0" y="155" font-size="18" fill="#283f43" font-weight="700" text-anchor="middle">기록으로 확인</text>
<text x="600.0" y="182" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">오류 코드와 작업 확인</text>
<text x="600.0" y="205" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">지원 전 개인 경로 가리기</text>
