<svg xmlns="http://www.w3.org/2000/svg" width="320" height="432" viewBox="0 0 320 432" role="img" aria-labelledby="title desc">
<title id="title">이후 같은 파일이 다시 들어오면</title><desc id="desc">감시 폴더에 번호 파일이 생기면 원래 파일과 내용을 비교합니다. 보관 이름의 시각은 작업 시각이 아니라 보관하는 파일의 마지막 수정 시각입니다.</desc>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif">
<rect width="320" height="432" rx="4" fill="#fffdf9"/>
<g transform="translate(9 19) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="36" y="15" width="76" height="73" rx="5" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M50 34H94" fill="none" stroke="#6e6258" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 46H94" fill="none" stroke="#6e6258" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 58H82" fill="none" stroke="#6e6258" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 70H91" fill="none" stroke="#6e6258" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">내용이 같으면</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">새 파일이 원래 이름이 됨</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">이전 파일은 지움</text>
<path d="M18 144H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><path d="M19 35V20Q19 15 25 15H53L65 27H119Q125 27 125 33V78Q125 85 118 85H26Q19 85 19 78Z" fill="#ead7b9" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 37H125L116 85H27Z" fill="#f4e7d2" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="39" width="34" height="39" rx="3" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><rect x="77" y="48" width="34" height="39" rx="3" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/></g>
<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">내용이 다르면</text>
<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">이전 파일은 _history로</text>
<text x="120" y="224" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">새 파일은 원래 이름으로</text>
<path d="M18 288H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><circle cx="72" cy="49" r="38" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M72 23V50L90 61" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="323" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">보관 파일의 이름</text>
<text x="120" y="348" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">그 파일의 마지막 수정</text>
<text x="120" y="368" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">시각</text>
<text x="120" y="388" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">같은 이름은 번호를 붙임</text>
</g></svg>
