<svg xmlns="http://www.w3.org/2000/svg" width="320" height="432" viewBox="0 0 320 432" role="img" aria-labelledby="title desc">
<title id="title">그림 파일을 이미지로 복사하기</title><desc id="desc">그림으로 복사는 이미지 데이터를 복사합니다. Windows 11 기본 메뉴에서는 더 많은 옵션 표시로 들어가고, 기존 방식의 메뉴가 바로 열리면 곧바로 선택합니다.</desc>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif">
<rect width="320" height="432" rx="4" fill="#fffdf9"/>
<text x="27" y="18" font-size="10" fill="#8a622f" font-weight="700" text-anchor="middle">01</text>
<g transform="translate(9 19) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="18" y="15" width="110" height="70" rx="6" fill="#f0e9df" stroke="#8a622f" stroke-width="2"/><circle cx="103" cy="33" r="8" fill="#ead7b9" stroke="#b7894e" stroke-width="2"/><path d="M24 78L54 36L80 66L95 49L122 79Z" fill="#ece5d7" stroke="#8a622f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">그림 파일 한 개</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">PNG·JPEG·BMP 선택</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">원본 파일은 그대로 유지</text>
<path d="M300 123V137M295 132L300 137L305 132" fill="none" stroke="#8a622f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="27" y="162" font-size="10" fill="#8a622f" font-weight="700" text-anchor="middle">02</text>
<path d="M18 144H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="28" y="5" width="96" height="86" rx="6" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M43 21H94" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 40H94" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="49" width="84" height="19" rx="3" fill="#ece5d7" stroke="#ece5d7" stroke-width="2"/><path d="M43 60H94" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 79H94" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 60L10 84L18 78L24 90L31 86L24 74L35 72Z" fill="#fffdf9" stroke="#2c2622" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">그림으로 복사</text>
<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">탐색기 메뉴에서 선택</text>
<text x="120" y="224" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">파일 경로 대신 그림 자체</text>
<path d="M300 267V281M295 276L300 281L305 276" fill="none" stroke="#8a622f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="27" y="306" font-size="10" fill="#8a622f" font-weight="700" text-anchor="middle">03</text>
<path d="M18 288H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="31" y="9" width="83" height="80" rx="7" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><rect x="55" y="4" width="36" height="14" rx="4" fill="#f2e9dd" stroke="#8a622f" stroke-width="2"/><rect x="40" y="28" width="65" height="48" rx="3" fill="#f0e9df" stroke="#ded2c4" stroke-width="2"/><circle cx="87" cy="40" r="5" fill="#ead7b9" stroke="#b7894e" stroke-width="2"/><path d="M43 71L60 49L74 63L83 56L103 73Z" fill="#ece5d7" stroke="#8a622f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="323" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">사용할 앱에 붙이기</text>
<text x="120" y="348" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">복사 완료 안내 확인</text>
<text x="120" y="368" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">Ctrl+V로 붙여넣기</text>
</g></svg>
