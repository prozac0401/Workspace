<text x="135" y="35" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">업데이트</text>
<text x="135" y="60" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">새 버전 MSI 실행</text>
<text x="135" y="80" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">자동으로 새 버전 설치 안 함</text>
<path d="M18 144H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
