<svg xmlns="http://www.w3.org/2000/svg" width="320" height="432" viewBox="0 0 320 432" role="img" aria-labelledby="title desc">
<title id="title">추가 안내 — 필요한 경우만</title><desc id="desc">보통은 프로그램 화면이나 탐색기 메뉴로 충분합니다. 명령이 필요한 경우에만 아래 설명을 펼쳐 대상 경로와 작업을 확인하세요.</desc>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif">
<rect width="320" height="432" rx="4" fill="#fffdf9"/>
<g transform="translate(9 19) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><path d="M19 35V20Q19 15 25 15H53L65 27H119Q125 27 125 33V78Q125 85 118 85H26Q19 85 19 78Z" fill="#ead7b9" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 37H125L116 85H27Z" fill="#f4e7d2" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M41 55H83M41 65H68" fill="none" stroke="#b7894e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">설치 위치 확인</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">프로그램·기록 위치 보기</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">설정은 직접 바꾸지 않기</text>
<path d="M18 144H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="14" y="10" width="116" height="71" rx="6" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M15 25H129" fill="none" stroke="#ded2c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="18" r="2" fill="#b7894e"/><circle cx="31" cy="18" r="2" fill="#b7894e"/><circle cx="39" cy="18" r="2" fill="#b7894e"/><path d="M72 34V56M62 48L72 58L82 48" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 62V69H101V62" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">명령으로 설치</text>
<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">담당자용 설치·복구·제거</text>
<text x="120" y="224" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">필요한 명령 하나만 실행</text>
<path d="M18 288H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="15" y="12" width="115" height="72" rx="6" fill="#2c2622" stroke="#2c2622" stroke-width="2"/><path d="M29 30L38 37L29 44" fill="none" stroke="#e3c799" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 37H90M29 57H104M29 69H73" fill="none" stroke="#e3c799" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="323" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">명령으로 상태 관리</text>
<text x="120" y="348" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">대상 폴더를 직접 지정</text>
<text x="120" y="368" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">결과와 종료 코드 확인</text>
</g></svg>
