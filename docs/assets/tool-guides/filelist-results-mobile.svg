<svg xmlns="http://www.w3.org/2000/svg" width="320" height="432" viewBox="0 0 320 432" role="img" aria-labelledby="title desc">
<title id="title">결과 확인·제거</title><desc id="desc">큰 목록은 시트별로 살펴보고 실패 항목도 확인하세요. 프로그램을 제거해도 보관한 Excel 파일과 중복 검사의 저장 정보는 남습니다.</desc>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif">
<rect width="320" height="432" rx="4" fill="#fffdf9"/>
<g transform="translate(9 19) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="22" y="9" width="100" height="78" rx="4" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M23 28H121M49 10V86M89 10V86M23 47H121M23 66H121" fill="none" stroke="#ded2c4" stroke-width="2"/><rect x="24" y="11" width="96" height="15" rx="2" fill="#ece5d7"/><rect x="50" y="29" width="38" height="18" rx="1" fill="#ece5d7" stroke="#8a622f" stroke-width="2"/><text x="68" y="43" font-size="12" fill="#2c2622" font-weight="700" text-anchor="middle">A1</text><path d="M56 56H80M56 75H76" fill="none" stroke="#6e6258" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">결과를 나누어 확인</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">큰 목록은 여러 시트로</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">실패 항목은 Errors에서</text>
<path d="M18 144H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="28" y="5" width="96" height="86" rx="6" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M43 21H94" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 40H94" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="49" width="84" height="19" rx="3" fill="#ece5d7" stroke="#ece5d7" stroke-width="2"/><path d="M43 60H94" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 79H94" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 60L10 84L18 78L24 90L31 86L24 74L35 72Z" fill="#fffdf9" stroke="#2c2622" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">메뉴가 없을 때</text>
<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">새 탐색기 창에서 확인</text>
<text x="120" y="224" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">계속 안 되면 배포 안내</text>
<text x="120" y="244" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">확인</text>
<path d="M18 288H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><path d="M42 29L47 86H97L102 29M36 28H108M57 27V16H87V27M61 42V72M83 42V72" fill="#f2e9dd" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="323" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">설치된 앱에서 제거</text>
<text x="120" y="348" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">만든 Excel 파일은 유지</text>
<text x="120" y="368" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">중복 검사 저장 정보도</text>
<text x="120" y="388" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">유지</text>
</g></svg>
