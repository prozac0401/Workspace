<text x="135" y="204" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">데이터 폴더 전체 복사</text>
<text x="135" y="224" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">Office 원본은 별도 백업</text>
