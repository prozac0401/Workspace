<text x="135" y="35" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">저장하고 종료</text>
<text x="135" y="60" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">메모장 복원 파일 저장·닫기</text>
<text x="135" y="80" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">업무 책갈피도 종료</text>
