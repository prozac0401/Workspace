<text x="135" y="348" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">현재 데이터 먼저 보존</text>
<text x="135" y="368" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">백업을 원래 위치로 복사</text>
