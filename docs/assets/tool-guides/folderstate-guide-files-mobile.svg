<svg xmlns="http://www.w3.org/2000/svg" width="320" height="432" viewBox="0 0 320 432" role="img" aria-labelledby="title desc">
<title id="title">폴더와 파일은 어떻게 되나요?</title><desc id="desc">선택한 폴더의 상태와 아이콘 설정만 다룹니다. 업무 파일 내용이나 하위 폴더 목록을 읽거나 바꾸지 않습니다.</desc>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif">
<rect width="320" height="432" rx="4" fill="#fffdf9"/>
<g transform="translate(9 19) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><path d="M27 24H119" fill="none" stroke="#ded2c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="53" cy="24" r="9" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M27 49H119" fill="none" stroke="#ded2c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="93" cy="49" r="9" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M27 74H119" fill="none" stroke="#ded2c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="65" cy="74" r="9" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/></g>
<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">도구가 다루는 것</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">선택한 폴더의 상태</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">아이콘 설정 파일</text>
<path d="M18 144H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><path d="M72 8L112 24V49Q112 75 72 91Q32 75 32 49V24Z" fill="#ece5d7" stroke="#8a622f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="43" width="34" height="26" rx="4" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M62 43V33Q72 18 82 33V43" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">그대로 두는 것</text>
<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">폴더 이름과 업무 파일</text>
<text x="120" y="224" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">하위 폴더 목록</text>
<path d="M18 288H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><g transform="rotate(-35 72 50)"><rect x="23" y="33" width="64" height="33" rx="16" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><rect x="61" y="33" width="64" height="33" rx="16" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M57 50H90" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="120" y="323" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">위치 그대로</text>
<text x="120" y="348" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">문서 링크와 바로가기</text>
<text x="120" y="368" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">같은 폴더 위치 유지</text>
</g></svg>
