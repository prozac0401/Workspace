<text x="120.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">첫 시트의 헤더 맞추기</text>
<text x="120.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">위에서 아래로 합치기</text>
