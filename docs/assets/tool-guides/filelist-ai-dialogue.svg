<text x="120.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">업무의 쓰임 설명</text>
<text x="120.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">진행 중·보관·재사용 구분</text>
<text x="120.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">애매한 파일은 질문으로</text>
