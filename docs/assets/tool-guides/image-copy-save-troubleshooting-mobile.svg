<svg xmlns="http://www.w3.org/2000/svg" width="320" height="432" viewBox="0 0 320 432" role="img" aria-labelledby="title desc">
<title id="title">메뉴가 없거나 작업이 실패할 때</title><desc id="desc">저장 성공과 탐색기에서 파일을 선택하는 동작은 별개입니다. 문의할 때는 사용한 메뉴와 안내 문구를 적어 주세요.</desc>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif">
<rect width="320" height="432" rx="4" fill="#fffdf9"/>
<g transform="translate(9 19) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="28" y="5" width="96" height="86" rx="6" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M43 21H94" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 40H94" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="49" width="84" height="19" rx="3" fill="#ece5d7" stroke="#ece5d7" stroke-width="2"/><path d="M43 60H94" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 79H94" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 60L10 84L18 78L24 90L31 86L24 74L35 72Z" fill="#fffdf9" stroke="#2c2622" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">메뉴가 없으면</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">더 많은 옵션 표시 확인</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">이미지와 위치를 다시 확인</text>
<path d="M18 144H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><path d="M19 35V20Q19 15 25 15H53L65 27H119Q125 27 125 33V78Q125 85 118 85H26Q19 85 19 78Z" fill="#ead7b9" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 37H125L116 85H27Z" fill="#f4e7d2" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="108" cy="72" r="20" fill="#f2e9dd" stroke="#8a622f" stroke-width="2"/><path d="M98 72L105 79L119 64" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">선택 표시가 없으면</text>
<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">메뉴를 누른 폴더 확인</text>
<text x="120" y="224" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">만들어진 PNG가 있는지</text>
<text x="120" y="244" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">확인</text>
<path d="M18 288H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><circle cx="72" cy="49" r="38" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M61 33V65M83 33V65" fill="none" stroke="#b7894e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="323" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">탐색기가 멈추면</text>
<text x="120" y="348" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">반복 실행을 멈추기</text>
<text x="120" y="368" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">재현 순서와 버전으로 문의</text>
</g></svg>
