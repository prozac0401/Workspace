<text x="135" y="179" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">메모장</text>
<text x="135" y="204" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">기록 당시 본문도 보관</text>
<text x="135" y="224" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">새 복원 파일로 열기</text>
