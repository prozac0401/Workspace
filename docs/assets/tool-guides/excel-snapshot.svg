<text x="360.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">담을 때의 값 확인</text>
<text x="360.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">이미 담아 둔 첫 목록</text>
<text x="360.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">일부 값과 위치를 표시</text>
