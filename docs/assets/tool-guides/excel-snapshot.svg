<text x="120.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">원본을 수정해도</text>
<text x="120.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">현재 셀의 값만 변경</text>
<text x="120.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">담은 값은 자동 갱신 안 됨</text>
<path d="M240 29V212" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
