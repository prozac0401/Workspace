<svg xmlns="http://www.w3.org/2000/svg" width="360" height="288" viewBox="0 0 360 288" role="img" aria-labelledby="title desc">
<title id="title">화면 밖으로 스크롤된 칸은 제외되나요?</title><desc id="desc">보이는 칸은 필터나 행·열 숨김으로 가려지지 않은 칸입니다. 화면 밖으로 스크롤되었다는 이유로 빠지지 않습니다.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="360" height="288" rx="12" fill="#fffcf7"/>
<g transform="translate(9 19) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="14" y="10" width="116" height="71" rx="6" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M15 25H129" fill="none" stroke="#d6e0dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="18" r="2" fill="#be8740"/><circle cx="31" cy="18" r="2" fill="#be8740"/><circle cx="39" cy="18" r="2" fill="#be8740"/><rect x="26" y="34" width="42" height="35" rx="8" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><path d="M79 38H112M79 48H109M79 58H97" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="35" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">화면 밖의 칸</text>
<text x="135" y="60" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">선택 범위에 포함되고</text>
<text x="135" y="80" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">숨기지 않았다면 포함</text>
<path d="M18 144H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="22" y="9" width="100" height="78" rx="4" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M23 28H121M49 10V86M89 10V86M23 47H121M23 66H121" fill="none" stroke="#d6e0dc" stroke-width="2"/><rect x="24" y="11" width="96" height="15" rx="2" fill="#dcece7"/><rect x="24" y="48" width="96" height="17" fill="#e8e8e5"/><path d="M100 53L131 53L120 65V78L111 82V65Z" fill="#dcece7" stroke="#277a73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M56 37H80M56 75H79" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="179" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">숨김 처리한 칸</text>
<text x="135" y="204" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">필터로 가린 행과</text>
<text x="135" y="224" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">수동으로 숨긴 행·열 제외</text>
</g></svg>
