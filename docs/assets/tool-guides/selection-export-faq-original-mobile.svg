<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">값·수식·기본 모양</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">필터·숨김 상태 유지</text>
