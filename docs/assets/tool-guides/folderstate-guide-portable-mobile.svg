<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">선택한 폴더 안</text>
<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">아이콘 위치 고르기</text>
<text x="120" y="224" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">아이콘 저장 위치 적용</text>
