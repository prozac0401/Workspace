<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">저장 상태 확인</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">처음이면 먼저 상태 지정</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">아이콘 저장 위치 펼치기</text>
<path d="M300 123V137M295 132L300 137L305 132" fill="none" stroke="#8a622f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
