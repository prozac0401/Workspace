<svg xmlns="http://www.w3.org/2000/svg" width="320" height="432" viewBox="0 0 320 432" role="img" aria-labelledby="title desc">
<title id="title">포스트잇 스티커로 보기</title><desc id="desc">스티커는 한 줄 메모와 오른쪽 화살표를 표시합니다. 편집할 때만 필요한 높이로 늘고, 저장·취소 후 원래 크기로 돌아갑니다. 편집 중 직접 옮기거나 정렬한 위치는 유지합니다.</desc>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif">
<rect width="320" height="432" rx="4" fill="#fffdf9"/>
<g transform="translate(9 19) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="36" y="15" width="76" height="73" rx="5" fill="#f7edda" stroke="#b7894e" stroke-width="2"/><path d="M50 34H94" fill="none" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 46H94" fill="none" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 58H82" fill="none" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 70H91" fill="none" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M104 88L112 79H104Z" fill="#ead7b9" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">한 줄 메모</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">제목 클릭·Ctrl+E로 편집</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">다른 창으로 이동하면 저장</text>
<path d="M18 144H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><g transform="rotate(-35 72 50)"><rect x="23" y="33" width="64" height="33" rx="16" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><rect x="61" y="33" width="64" height="33" rx="16" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M57 50H90" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">오른쪽 화살표</text>
<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">저장한 작업 열기</text>
<text x="120" y="224" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">누른 스티커에 처리 중</text>
<text x="120" y="244" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">표시</text>
<path d="M18 288H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="28" y="5" width="96" height="86" rx="6" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M43 21H94" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 40H94" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="34" y="49" width="84" height="19" rx="3" fill="#ece5d7" stroke="#ece5d7" stroke-width="2"/><path d="M43 60H94" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 79H94" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 60L10 84L18 78L24 90L31 86L24 74L35 72Z" fill="#fffdf9" stroke="#2c2622" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="323" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">나머지는 우클릭</text>
<text x="120" y="348" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">접기·숨기기·지우기</text>
<text x="120" y="368" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">숨기기는 화면에서만 숨김</text>
</g></svg>
