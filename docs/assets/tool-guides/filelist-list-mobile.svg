<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">선택 항목만 담을지</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">하위 폴더도 담을지 결정</text>
