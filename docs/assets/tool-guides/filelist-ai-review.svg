<svg xmlns="http://www.w3.org/2000/svg" width="720" height="244" viewBox="0 0 720 244" role="img" aria-labelledby="title desc">
<title id="title">Excel에 분류 초안과 확정한 복사 목록 남기기</title><desc id="desc">원래 표와 숨겨진 정보는 보존합니다. 분류의 근거와 사람이 확정한 목적지를 Excel에 남겨 실행할 목록과 대조하세요.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="720" height="244" rx="12" fill="#fffcf7"/>
<g transform="translate(48 25)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="22" y="9" width="100" height="78" rx="4" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M23 28H121M49 10V86M89 10V86M23 47H121M23 66H121" fill="none" stroke="#d6e0dc" stroke-width="2"/><rect x="24" y="11" width="96" height="15" rx="2" fill="#dcece7"/><rect x="50" y="29" width="38" height="18" rx="1" fill="#dcece7" stroke="#277a73" stroke-width="2"/><text x="68" y="43" font-size="12" fill="#277a73" font-weight="700" text-anchor="middle">A1</text><path d="M56 56H80M56 75H76" fill="none" stroke="#55676b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120.0" y="155" font-size="18" fill="#283f43" font-weight="700" text-anchor="middle">원래 결과표 보존</text>
<text x="120.0" y="182" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">별도 분류 초안 시트 작성</text>
<text x="120.0" y="205" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">항목번호로 원본과 연결</text>
<path d="M227 71H253M246 64L253 71L246 78" fill="none" stroke="#277a73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(288 25)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="36" y="15" width="76" height="73" rx="5" fill="#fff6d8" stroke="#be8740" stroke-width="2"/><path d="M50 34H94" fill="none" stroke="#be8740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 46H94" fill="none" stroke="#be8740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 58H82" fill="none" stroke="#be8740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 70H91" fill="none" stroke="#be8740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M104 88L112 79H104Z" fill="#f4dfb7" stroke="#be8740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="360.0" y="155" font-size="18" fill="#283f43" font-weight="700" text-anchor="middle">검토 내용 기록</text>
<text x="360.0" y="182" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">분류 이유·확인할 것 작성</text>
<text x="360.0" y="205" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">사람이 목적지를 확정</text>
<path d="M467 71H493M486 64L493 71L486 78" fill="none" stroke="#277a73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(528 25)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><path d="M72 8L112 24V49Q112 75 72 91Q32 75 32 49V24Z" fill="#dcece7" stroke="#277a73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 48L66 63L93 34" fill="none" stroke="#277a73" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="600.0" y="155" font-size="18" fill="#283f43" font-weight="700" text-anchor="middle">복사할 행만 확정</text>
<text x="600.0" y="182" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">경로·개수·예상 크기 대조</text>
<text x="600.0" y="205" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">확정 행만 실행 목록으로</text>
</g></svg>
