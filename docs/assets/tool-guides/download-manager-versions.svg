<svg xmlns="http://www.w3.org/2000/svg" width="720" height="244" viewBox="0 0 720 244" role="img" aria-labelledby="title desc">
<title id="title">이전 버전에서 바뀐 점</title><desc id="desc">버전에 따라 창을 닫는 동작과 보관 파일 이름의 기준이 다릅니다. 0.2.1은 설치 실패 뒤 설치 정보가 남는 문제도 고쳤습니다.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="720" height="244" rx="12" fill="#fffcf7"/>
<g transform="translate(108 25)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="14" y="10" width="116" height="71" rx="6" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M15 25H129" fill="none" stroke="#d6e0dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="18" r="2" fill="#be8740"/><circle cx="31" cy="18" r="2" fill="#be8740"/><circle cx="39" cy="18" r="2" fill="#be8740"/><rect x="26" y="34" width="42" height="35" rx="8" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><path d="M79 38H112M79 48H109M79 58H97" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="180.0" y="155" font-size="18" fill="#283f43" font-weight="700" text-anchor="middle">0.2.0</text>
<text x="180.0" y="182" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">창을 닫으면 프로그램 종료</text>
<text x="180.0" y="205" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">이전 파일은 보관 작업 시각으로</text>
<path d="M360 29V212" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(468 25)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><circle cx="72" cy="49" r="38" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M72 23V50L90 61" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="540.0" y="155" font-size="18" fill="#283f43" font-weight="700" text-anchor="middle">0.2.1</text>
<text x="540.0" y="182" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">알림 영역의 종료로 끝내기</text>
<text x="540.0" y="205" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">이전 파일은 마지막 수정 시각으로</text>
</g></svg>
