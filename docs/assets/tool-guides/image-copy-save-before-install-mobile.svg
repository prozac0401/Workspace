<svg xmlns="http://www.w3.org/2000/svg" width="360" height="432" viewBox="0 0 360 432" role="img" aria-labelledby="title desc">
<title id="title">설치 전에 확인하세요</title><desc id="desc">설치·업데이트·복구·제거 권한과 평소 실행 권한을 구분합니다. 회사 PC는 허용된 설치 절차를 따르고 지원 환경을 먼저 확인하세요.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="360" height="432" rx="12" fill="#fffcf7"/>
<g transform="translate(9 19) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="14" y="10" width="116" height="71" rx="6" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M15 25H129" fill="none" stroke="#d6e0dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="18" r="2" fill="#be8740"/><circle cx="31" cy="18" r="2" fill="#be8740"/><circle cx="39" cy="18" r="2" fill="#be8740"/><path d="M65 82V91M79 82V91M51 92H93" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="37" y="36" width="69" height="31" rx="8" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/></g>
<text x="135" y="35" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">Windows 11 x64</text>
<text x="135" y="60" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">실제 로컬 폴더에서 사용</text>
<text x="135" y="80" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">네트워크·온라인 전용 제외</text>
<path d="M18 144H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="14" y="10" width="116" height="71" rx="6" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M15 25H129" fill="none" stroke="#d6e0dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="18" r="2" fill="#be8740"/><circle cx="31" cy="18" r="2" fill="#be8740"/><circle cx="39" cy="18" r="2" fill="#be8740"/><path d="M72 34V56M62 48L72 58L82 48" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 62V69H101V62" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="179" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">설치에는 관리자 승인</text>
<text x="135" y="204" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">0.2.1 MSI는 전자 서명 없음</text>
<text x="135" y="224" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">평소 작업은 일반 사용자</text>
<path d="M18 288H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="18" y="15" width="110" height="70" rx="6" fill="#eaf0fb" stroke="#277a73" stroke-width="2"/><circle cx="103" cy="33" r="8" fill="#f4dfb7" stroke="#be8740" stroke-width="2"/><path d="M24 78L54 36L80 66L95 49L122 79Z" fill="#dcece7" stroke="#277a73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="323" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">붙여넣는 앱도 확인</text>
<text x="135" y="348" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">이미지가 압축되거나</text>
<text x="135" y="368" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">투명 배경이 달라질 수 있음</text>
</g></svg>
