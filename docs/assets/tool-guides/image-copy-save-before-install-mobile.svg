<title id="title">설치 전에 확인하세요</title><desc id="desc">설치·업데이트·복구·제거 권한과 평소 실행 권한을 구분합니다. 평소 복사·저장은 일반 사용자 권한으로 실행합니다.</desc>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif">
