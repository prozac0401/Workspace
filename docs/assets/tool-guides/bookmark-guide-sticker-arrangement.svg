<text x="120.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">가까이 끌어 맞추기</text>
<text x="120.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">보이는 주변 스티커에 붙임</text>
<text x="120.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">Alt를 누르면 자유 이동</text>
