<text x="360.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">격자·가로·세로 중 선택</text>
<text x="360.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">마우스가 있는 모니터로</text>
