<svg xmlns="http://www.w3.org/2000/svg" width="360" height="432" viewBox="0 0 360 432" role="img" aria-labelledby="title desc">
<title id="title">보이는 칸에 값 넣기</title><desc id="desc">복사한 값 3개를 보이는 대상 3칸에 위에서 아래로 넣습니다. 숨긴 행은 유지하며 이름이나 사번을 찾아 연결하지 않습니다.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="360" height="432" rx="12" fill="#fffcf7"/>
<g transform="translate(9 19) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="22" y="9" width="100" height="78" rx="4" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M23 28H121M49 10V86M89 10V86M23 47H121M23 66H121" fill="none" stroke="#d6e0dc" stroke-width="2"/><rect x="24" y="11" width="96" height="15" rx="2" fill="#dcece7"/><text x="36" y="43" font-size="11" fill="#55676b" font-weight="400" text-anchor="middle">1</text><rect x="51" y="30" width="36" height="17" rx="2" fill="#dcece7" stroke="#dcece7" stroke-width="2"/><text x="69" y="43" font-size="13" fill="#277a73" font-weight="700" text-anchor="middle">85</text><text x="36" y="62" font-size="11" fill="#55676b" font-weight="400" text-anchor="middle">2</text><rect x="51" y="49" width="36" height="17" rx="2" fill="#dcece7" stroke="#dcece7" stroke-width="2"/><text x="69" y="62" font-size="13" fill="#277a73" font-weight="700" text-anchor="middle">90</text><text x="36" y="81" font-size="11" fill="#55676b" font-weight="400" text-anchor="middle">3</text><rect x="51" y="68" width="36" height="17" rx="2" fill="#dcece7" stroke="#dcece7" stroke-width="2"/><text x="69" y="81" font-size="13" fill="#277a73" font-weight="700" text-anchor="middle">78</text></g>
<text x="135" y="35" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">한 행·한 열 복사</text>
<text x="135" y="60" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">85 → 90 → 78</text>
<text x="135" y="80" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">Ctrl+C로 복사</text>
