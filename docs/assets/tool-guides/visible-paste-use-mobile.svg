<text x="120" y="323" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">보이는 칸에 붙여넣기</text>
<text x="120" y="348" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">2행 85 · 4행 90 · 5행</text>
<text x="120" y="368" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">78</text>
<text x="120" y="388" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">개수가 다르면 중단</text>
