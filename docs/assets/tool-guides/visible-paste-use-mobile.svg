<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">2·4·5행이 보이는 예</text>
<text x="120" y="224" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">숨긴 3행은 건너뛰기</text>
