<svg xmlns="http://www.w3.org/2000/svg" width="360" height="432" viewBox="0 0 360 432" role="img" aria-labelledby="title desc">
<title id="title">안내 문구에 따라 확인하세요</title><desc id="desc">오류 안내와 표의 조치를 함께 확인하세요. 상태·아이콘 설정과 되돌릴 때 쓸 파일은 삭제하거나 임의로 덮어쓰지 않습니다.</desc>
