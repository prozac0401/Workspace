<text x="135" y="179" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">원인별 조치</text>
<text x="135" y="204" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">경로·권한·연결 확인</text>
