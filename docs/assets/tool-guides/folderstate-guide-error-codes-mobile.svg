<text x="135" y="35" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">안내와 코드 확인</text>
<text x="135" y="60" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">화면 안내 읽기</text>
<text x="135" y="80" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">작업 기록의 오류 코드</text>
