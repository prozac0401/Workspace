<svg xmlns="http://www.w3.org/2000/svg" width="720" height="244" viewBox="0 0 720 244" role="img" aria-labelledby="title desc">
<title id="title">떨어진 칸들을 Ctrl로 고르거나 전체 행·열을 선택해도 되나요?</title><desc id="desc">필요한 칸만 이어진 네모 모양으로 선택하세요. 숨기지 않은 칸을 따로 골라 둘 필요는 없습니다.</desc>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif">
<rect width="720" height="244" rx="4" fill="#fffdf9"/>
<path d="M168 16H192" fill="none" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(108 25)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="22" y="9" width="100" height="78" rx="4" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M23 28H121M49 10V86M89 10V86M23 47H121M23 66H121" fill="none" stroke="#ded2c4" stroke-width="2"/><rect x="24" y="11" width="96" height="15" rx="2" fill="#ece5d7"/><rect x="50" y="29" width="38" height="18" rx="1" fill="#ece5d7" stroke="#8a622f" stroke-width="2"/><text x="68" y="43" font-size="12" fill="#2c2622" font-weight="700" text-anchor="middle">A1</text><path d="M56 56H80M56 75H76" fill="none" stroke="#6e6258" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="180.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">이어진 범위 하나</text>
<text x="180.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">한 칸이나 네모 범위</text>
<text x="180.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">필터·숨김이 있어도 가능</text>
<path d="M360 29V212" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M528 16H552" fill="none" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(468 25)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><circle cx="72" cy="49" r="38" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M61 33V65M83 33V65" fill="none" stroke="#b7894e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="540.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">다시 골라야 할 범위</text>
<text x="540.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">Ctrl로 고른 여러 범위</text>
<text x="540.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">전체 행·열·시트 선택</text>
