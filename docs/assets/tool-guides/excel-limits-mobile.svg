<svg xmlns="http://www.w3.org/2000/svg" width="360" height="432" viewBox="0 0 360 432" role="img" aria-labelledby="title desc">
<title id="title">비교할 때 알아둘 점</title><desc id="desc">두 목록을 같은 행 수로 나누면 잘못된 차이가 생길 수 있습니다. 입력 상한 이내라도 시간 제한으로 중단될 수 있습니다.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="360" height="432" rx="12" fill="#fffcf7"/>
<g transform="translate(9 19) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="22" y="9" width="100" height="78" rx="4" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M23 28H121M49 10V86M89 10V86M23 47H121M23 66H121" fill="none" stroke="#d6e0dc" stroke-width="2"/><rect x="24" y="11" width="96" height="15" rx="2" fill="#dcece7"/><rect x="24" y="48" width="96" height="17" fill="#e8e8e5"/><path d="M100 53L131 53L120 65V78L111 82V65Z" fill="#dcece7" stroke="#277a73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M56 37H80M56 75H79" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="35" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">보이는 값 비교</text>
<text x="135" y="60" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">숨김·필터 셀 제외</text>
<text x="135" y="80" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">빈칸·오류도 제외</text>
<path d="M18 144H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="22" y="9" width="100" height="78" rx="4" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M23 28H121M49 10V86M89 10V86M23 47H121M23 66H121" fill="none" stroke="#d6e0dc" stroke-width="2"/><rect x="24" y="11" width="96" height="15" rx="2" fill="#dcece7"/><path d="M49 48H120V65H49Z" fill="#f6e7cd" stroke="#be8740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="69" y="43" font-size="13" fill="#283f43" font-weight="400" text-anchor="middle">A</text><text x="104" y="43" font-size="13" fill="#283f43" font-weight="400" text-anchor="middle">3</text><text x="69" y="62" font-size="13" fill="#283f43" font-weight="400" text-anchor="middle">B</text><text x="104" y="62" font-size="13" fill="#283f43" font-weight="400" text-anchor="middle">1</text><text x="69" y="81" font-size="13" fill="#283f43" font-weight="400" text-anchor="middle">C</text><text x="104" y="81" font-size="13" fill="#283f43" font-weight="400" text-anchor="middle">2</text></g>
<text x="135" y="179" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">나눌 때는 값 기준</text>
<text x="135" y="204" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">같은 비교값은 양쪽에서</text>
<text x="135" y="224" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">같은 묶음에 넣기</text>
<path d="M18 288H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><circle cx="72" cy="49" r="38" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M61 33V65M83 33V65" fill="none" stroke="#be8740" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="323" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">취소 후 종료 확인</text>
<text x="135" y="348" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">Esc 또는 작업 취소</text>
<text x="135" y="368" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">도구 모음의 취소 완료 확인</text>
<text x="66" y="405" font-size="12" fill="#277a73" font-weight="700" text-anchor="middle">Esc</text>
</g></svg>
