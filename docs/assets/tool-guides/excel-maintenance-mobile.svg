<svg xmlns="http://www.w3.org/2000/svg" width="360" height="432" viewBox="0 0 360 432" role="img" aria-labelledby="title desc">
<title id="title">업데이트·제거하기</title><desc id="desc">업데이트·제거 전에는 파일을 저장하고 Excel을 닫으세요. 비교 설정을 초기화하려면 설치된 도구의 기본값으로 되돌리기를 사용합니다.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="360" height="432" rx="12" fill="#fffcf7"/>
<g transform="translate(9 19) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="14" y="10" width="116" height="71" rx="6" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M15 25H129" fill="none" stroke="#d6e0dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="18" r="2" fill="#be8740"/><circle cx="31" cy="18" r="2" fill="#be8740"/><circle cx="39" cy="18" r="2" fill="#be8740"/><path d="M72 34V56M62 48L72 58L82 48" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 62V69H101V62" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="35" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">업데이트</text>
<text x="135" y="60" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">저장하고 Excel 종료</text>
<text x="135" y="80" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">새 설치 파일 실행</text>
<path d="M18 144H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><path d="M42 29L47 86H97L102 29M36 28H108M57 27V16H87V27M61 42V72M83 42V72" fill="#eef4f1" stroke="#55676b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="179" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">설치 방식별 제거</text>
<text x="135" y="204" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">EXE는 Windows 설정</text>
<text x="135" y="224" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">ZIP은 Uninstall.cmd</text>
<path d="M18 288H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><path d="M27 24H119" fill="none" stroke="#d6e0dc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="53" cy="24" r="9" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M27 49H119" fill="none" stroke="#d6e0dc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="93" cy="49" r="9" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M27 74H119" fill="none" stroke="#d6e0dc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="65" cy="74" r="9" fill="#fff" stroke="#277a73" stroke-width="2"/></g>
<text x="135" y="323" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">비교 설정은 보존</text>
<text x="135" y="348" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">같은 계정에 남음</text>
<text x="135" y="368" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">도구에서 기본값 복원</text>
</g></svg>
