<svg xmlns="http://www.w3.org/2000/svg" width="360" height="432" viewBox="0 0 360 432" role="img" aria-labelledby="title desc">
<title id="title">처리할 수 있는 이미지와 위치</title><desc id="desc">확장자가 맞아도 색상 저장 방식·크기·위치에 따라 처리하지 않을 수 있습니다. 지원 범위와 가로·세로 및 데이터 상한을 함께 확인하세요.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="360" height="432" rx="12" fill="#fffcf7"/>
<g transform="translate(9 19) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="18" y="15" width="110" height="70" rx="6" fill="#eaf0fb" stroke="#277a73" stroke-width="2"/><circle cx="103" cy="33" r="8" fill="#f4dfb7" stroke="#be8740" stroke-width="2"/><path d="M24 78L54 36L80 66L95 49L122 79Z" fill="#dcece7" stroke="#277a73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="35" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">화면용 정지 이미지</text>
<text x="135" y="60" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">PNG·JPEG·BMP 한 장</text>
<text x="135" y="80" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">저장 결과는 PNG</text>
<path d="M18 144H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><path d="M19 35V20Q19 15 25 15H53L65 27H119Q125 27 125 33V78Q125 85 118 85H26Q19 85 19 78Z" fill="#f4dfb7" stroke="#be8740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 37H125L116 85H27Z" fill="#ffeac5" stroke="#be8740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M41 55H83M41 65H68" fill="none" stroke="#be8740" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="179" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">실제 로컬 위치</text>
<text x="135" y="204" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">접근할 수 있는 내부 저장장치</text>
<text x="135" y="224" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">연결된 위치는 제외</text>
<path d="M18 288H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><circle cx="72" cy="49" r="38" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M61 33V65M83 33V65" fill="none" stroke="#be8740" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="323" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">상한을 넘으면 중단</text>
<text x="135" y="348" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">최대 총 5천만 픽셀</text>
<text x="135" y="368" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">임의로 크기·비율 축소 안 함</text>
</g></svg>
