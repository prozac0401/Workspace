<text x="135" y="348" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">원래 파일은 그대로</text>
<text x="135" y="368" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">이어 쓴 글은 직접 저장</text>
