<text x="135" y="179" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">기록 당시 글 보관</text>
<text x="135" y="204" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">Ctrl+Alt+B로 기록</text>
<text x="135" y="224" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">바뀐 글은 다시 기록</text>
