<text x="120.0" y="182" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">아직 저장하지 않은 상태</text>
<text x="120.0" y="205" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">결과를 먼저 확인</text>
