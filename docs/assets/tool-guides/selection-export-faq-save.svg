<text x="360.0" y="155" font-size="18" fill="#283f43" font-weight="700" text-anchor="middle">저장 실행</text>
<text x="360.0" y="182" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">Ctrl+S 또는 파일 → 저장</text>
