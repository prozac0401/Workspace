<svg xmlns="http://www.w3.org/2000/svg" width="720" height="244" viewBox="0 0 720 244" role="img" aria-labelledby="title desc">
<title id="title">업데이트·제거하기</title><desc id="desc">열려 있던 Excel에는 다시 시작한 뒤 새 버전이 적용됩니다. 같은 버전 재설치·제거 전에는 모든 Excel 창을 닫으세요.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="720" height="244" rx="12" fill="#fffcf7"/>
<g transform="translate(48 25)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="14" y="10" width="116" height="71" rx="6" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M15 25H129" fill="none" stroke="#d6e0dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="18" r="2" fill="#be8740"/><circle cx="31" cy="18" r="2" fill="#be8740"/><circle cx="39" cy="18" r="2" fill="#be8740"/><path d="M72 34V56M62 48L72 58L82 48" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M43 62V69H101V62" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120.0" y="155" font-size="18" fill="#283f43" font-weight="700" text-anchor="middle">업데이트</text>
<text x="120.0" y="182" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">작업을 저장하고 설치</text>
<text x="120.0" y="205" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">Excel을 모두 닫고 다시 열기</text>
<path d="M240 29V212" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(288 25)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><path d="M42 29L47 86H97L102 29M36 28H108M57 27V16H87V27M61 42V72M83 42V72" fill="#eef4f1" stroke="#55676b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="360.0" y="155" font-size="18" fill="#283f43" font-weight="700" text-anchor="middle">도구 제거</text>
<text x="360.0" y="182" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">모든 Excel 창을 닫기</text>
<text x="360.0" y="205" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">Windows 설치된 앱에서 제거</text>
<path d="M480 29V212" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(528 25)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="36" y="15" width="76" height="73" rx="5" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M50 34H94" fill="none" stroke="#55676b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 46H94" fill="none" stroke="#55676b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 58H82" fill="none" stroke="#55676b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 70H91" fill="none" stroke="#55676b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="600.0" y="155" font-size="18" fill="#283f43" font-weight="700" text-anchor="middle">업무 파일 보존</text>
<text x="600.0" y="182" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">원본 Excel 파일 유지</text>
<text x="600.0" y="205" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">직접 저장한 결과도 유지</text>
</g></svg>
