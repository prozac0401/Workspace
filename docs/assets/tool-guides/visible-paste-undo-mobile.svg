<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">자체 메뉴로 되돌리기</text>
<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">마지막 성공 작업 한 번</text>
<text x="120" y="224" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">원래 값과 수식 복구</text>
