<svg xmlns="http://www.w3.org/2000/svg" width="720" height="244" viewBox="0 0 720 244" role="img" aria-labelledby="title desc">
<title id="title">값과 표시 형식</title><desc id="desc">빈칸·숫자·문자열의 위치와 값을 보존합니다. 날짜 숫자와 대상 서식을 그대로 쓰므로 원본과 표시가 달라질 수 있습니다.</desc>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif">
<rect width="720" height="244" rx="4" fill="#fffdf9"/>
<path d="M108 16H132" fill="none" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(48 25)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="22" y="9" width="100" height="78" rx="4" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M23 28H121M49 10V86M89 10V86M23 47H121M23 66H121" fill="none" stroke="#ded2c4" stroke-width="2"/><rect x="24" y="11" width="96" height="15" rx="2" fill="#ece5d7"/><text x="36" y="43" font-size="11" fill="#6e6258" font-weight="400" text-anchor="middle">1</text><rect x="51" y="30" width="36" height="17" rx="2" fill="#ece5d7" stroke="#ece5d7" stroke-width="2"/><text x="69" y="43" font-size="13" fill="#2c2622" font-weight="700" text-anchor="middle">85</text><text x="36" y="62" font-size="11" fill="#6e6258" font-weight="400" text-anchor="middle">2</text><text x="36" y="81" font-size="11" fill="#6e6258" font-weight="400" text-anchor="middle">3</text><rect x="51" y="68" width="36" height="17" rx="2" fill="#ece5d7" stroke="#ece5d7" stroke-width="2"/><text x="69" y="81" font-size="13" fill="#2c2622" font-weight="700" text-anchor="middle">78</text></g>
<text x="120.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">빈칸도 자리 유지</text>
<text x="120.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">해당 순서의 내용을 비움</text>
<text x="120.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">빈칸을 빼고 당기지 않음</text>
<path d="M240 29V212" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M348 16H372" fill="none" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(288 25)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="22" y="9" width="100" height="78" rx="4" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M23 28H121M49 10V86M89 10V86M23 47H121M23 66H121" fill="none" stroke="#ded2c4" stroke-width="2"/><rect x="24" y="11" width="96" height="15" rx="2" fill="#ece5d7"/><rect x="50" y="29" width="38" height="18" rx="1" fill="#ece5d7" stroke="#8a622f" stroke-width="2"/><text x="68" y="43" font-size="12" fill="#2c2622" font-weight="700" text-anchor="middle">A1</text><path d="M56 56H80M56 75H76" fill="none" stroke="#6e6258" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="360.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">수식은 결과만</text>
<text x="360.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">계산 결과 값을 입력</text>
<text x="360.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">대상의 표시 형식 유지</text>
<path d="M480 29V212" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M588 16H612" fill="none" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(528 25)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><circle cx="72" cy="49" r="38" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M72 23V50L90 61" fill="none" stroke="#8a622f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="600.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">날짜는 원래 숫자</text>
<text x="600.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">1900·1904 보정 안 함</text>
<text x="600.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">날짜 표시가 달라질 수 있음</text>
</g></svg>
