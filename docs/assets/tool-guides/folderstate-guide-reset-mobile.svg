<svg xmlns="http://www.w3.org/2000/svg" width="360" height="432" viewBox="0 0 360 432" role="img" aria-labelledby="title desc">
<title id="title">표시를 지우거나 아이콘을 다시 보이게 하기</title><desc id="desc">시작 전은 상태를 저장하고, 상태 표시 지우기는 상태 자체를 없앱니다. 아이콘 다시 표시는 저장된 상태를 유지한 채 아이콘만 다시 설정합니다.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="360" height="432" rx="12" fill="#fffcf7"/>
<g transform="translate(9 19) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><path d="M19 35V20Q19 15 25 15H53L65 27H119Q125 27 125 33V78Q125 85 118 85H26Q19 85 19 78Z" fill="#f4dfb7" stroke="#be8740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 37H125L116 85H27Z" fill="#ffeac5" stroke="#be8740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="105" cy="72" r="17" fill="#fffcf7" stroke="#55676b" stroke-width="2"/></g>
<text x="135" y="35" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">시작 전</text>
<text x="135" y="60" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">아직 시작하지 않은 일</text>
<text x="135" y="80" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">시작 전 상태를 저장</text>
<path d="M18 144H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><circle cx="72" cy="49" r="38" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M94 51A23 23 0 1 1 65 28M65 28L55 27M65 28L60 39" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="179" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">상태 표시 지우기</text>
<text x="135" y="204" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">저장된 상태를 지움</text>
<text x="135" y="224" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">이전 아이콘 설정 복원</text>
<path d="M18 288H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><path d="M19 35V20Q19 15 25 15H53L65 27H119Q125 27 125 33V78Q125 85 118 85H26Q19 85 19 78Z" fill="#f4dfb7" stroke="#be8740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 37H125L116 85H27Z" fill="#ffeac5" stroke="#be8740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="108" cy="72" r="20" fill="#eef4f1" stroke="#277a73" stroke-width="2"/><path d="M98 72L105 79L119 64" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="323" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">아이콘 다시 표시</text>
<text x="135" y="348" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">현재 상태 아이콘 복구</text>
<text x="135" y="368" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">상태와 변경 시각 유지</text>
</g></svg>
