<text x="120.0" y="182" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">목록 또는 포스트잇</text>
<text x="120.0" y="205" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">스티커는 시작할 때 표시</text>
<path d="M240 29V212" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
