<text x="135" y="323" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">기록으로 확인</text>
<text x="135" y="348" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">오류 코드와 작업 확인</text>
<text x="135" y="368" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">지원 전 개인 경로 가리기</text>
