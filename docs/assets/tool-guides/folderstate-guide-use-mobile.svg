<text x="135" y="204" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">담당자가 상황을 판단</text>
<text x="135" y="224" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">상태를 누르면 저장</text>
