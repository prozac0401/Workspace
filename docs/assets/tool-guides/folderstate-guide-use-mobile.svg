<text x="135" y="348" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">완료·주의·실패 읽기</text>
<text x="135" y="368" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">탐색기 아이콘 확인</text>
