<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">원래 결과표 보존</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">별도 분류 초안 시트 작성</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">항목번호로 원본과 연결</text>
