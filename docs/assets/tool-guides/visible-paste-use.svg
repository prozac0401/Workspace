<text x="120.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">원본 영역 복사</text>
<text x="120.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">2행 × 2열을 선택</text>
<text x="120.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">Ctrl+C로 복사</text>
