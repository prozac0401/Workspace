<text x="360.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">시작 셀 하나 선택</text>
<text x="360.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">왼쪽 위 한 칸 선택</text>
