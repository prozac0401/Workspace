<svg xmlns="http://www.w3.org/2000/svg" width="320" height="432" viewBox="0 0 320 432" role="img" aria-labelledby="title desc">
<title id="title">같은 내용의 파일 찾기</title><desc id="desc">이름이 달라도 내용이 같으면 한 묶음으로 표시합니다. 중복 검사는 내용을 읽지만 원본을 삭제하거나 이동하지 않습니다.</desc>
<g font-family="Noto Sans CJK KR, Noto Sans KR, Malgun Gothic, Segoe UI, sans-serif">
<rect width="320" height="432" rx="4" fill="#fffdf9"/>
<text x="27" y="18" font-size="10" fill="#8a622f" font-weight="700" text-anchor="middle">01</text>
<g transform="translate(9 19) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><circle cx="62" cy="42" r="29" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M84 65L111 90" fill="none" stroke="#8a622f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 36H76M48 46H66" fill="none" stroke="#6e6258" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">비교 범위 선택</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">선택한 파일끼리 또는</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">폴더의 하위 항목까지</text>
<path d="M300 123V137M295 132L300 137L305 132" fill="none" stroke="#8a622f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="27" y="162" font-size="10" fill="#8a622f" font-weight="700" text-anchor="middle">02</text>
<path d="M18 144H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="36" y="15" width="76" height="73" rx="5" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M50 34H94" fill="none" stroke="#6e6258" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 46H94" fill="none" stroke="#6e6258" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 58H82" fill="none" stroke="#6e6258" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 70H91" fill="none" stroke="#6e6258" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">내용으로 비교</text>
<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">크기로 후보를 좁힌 뒤</text>
<text x="120" y="224" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">필요한 파일 내용을 읽음</text>
<path d="M300 267V281M295 276L300 281L305 276" fill="none" stroke="#8a622f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="27" y="306" font-size="10" fill="#8a622f" font-weight="700" text-anchor="middle">03</text>
<path d="M18 288H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.72)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><rect x="22" y="9" width="100" height="78" rx="4" fill="#fffdf9" stroke="#8a622f" stroke-width="2"/><path d="M23 28H121M49 10V86M89 10V86M23 47H121M23 66H121" fill="none" stroke="#ded2c4" stroke-width="2"/><rect x="24" y="11" width="96" height="15" rx="2" fill="#ece5d7"/><path d="M49 48H120V65H49Z" fill="#f6e7cd" stroke="#b7894e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="69" y="43" font-size="13" fill="#2c2622" font-weight="400" text-anchor="middle">A</text><text x="104" y="43" font-size="13" fill="#2c2622" font-weight="400" text-anchor="middle">3</text><text x="69" y="62" font-size="13" fill="#2c2622" font-weight="400" text-anchor="middle">B</text><text x="104" y="62" font-size="13" fill="#2c2622" font-weight="400" text-anchor="middle">1</text><text x="69" y="81" font-size="13" fill="#2c2622" font-weight="400" text-anchor="middle">C</text><text x="104" y="81" font-size="13" fill="#2c2622" font-weight="400" text-anchor="middle">2</text></g>
<text x="120" y="323" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">같은 파일 묶음 확인</text>
<text x="120" y="348" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">실패·제외도 따로 확인</text>
<text x="120" y="368" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">원본은 자동 정리하지 않음</text>
</g></svg>
