<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">업무별로 한곳에 모으기</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">10_Active를 출발점으로</text>
<path d="M18 144H302" fill="none" stroke="#ded2c4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
