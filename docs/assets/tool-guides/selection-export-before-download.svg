<text x="600.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">원본에서 칸 찾기</text>
<text x="600.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">27행 5열은 원본 E27</text>
