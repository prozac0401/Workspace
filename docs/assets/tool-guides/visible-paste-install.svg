<text x="360.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">설치 파일 실행</text>
<text x="360.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">Setup.exe 실행</text>
<text x="360.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">ZIP은 풀고 Install.cmd</text>
