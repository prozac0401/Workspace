<text x="120.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">저장하고 Excel 종료</text>
<text x="120.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">열린 파일을 먼저 저장</text>
<text x="120.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">모든 Excel 종료</text>
<rect x="85.0" y="109" width="70" height="23" rx="3" fill="#f2e9dd" stroke="#f2e9dd" stroke-width="2"/>
