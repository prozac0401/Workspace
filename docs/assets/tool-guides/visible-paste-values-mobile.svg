<svg xmlns="http://www.w3.org/2000/svg" width="360" height="432" viewBox="0 0 360 432" role="img" aria-labelledby="title desc">
<title id="title">값과 표시 형식</title><desc id="desc">빈칸·숫자·문자열의 위치와 값을 보존합니다. 날짜 숫자와 대상 서식을 그대로 쓰므로 원본과 표시가 달라질 수 있습니다.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="360" height="432" rx="12" fill="#fffcf7"/>
<g transform="translate(9 19) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="22" y="9" width="100" height="78" rx="4" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M23 28H121M49 10V86M89 10V86M23 47H121M23 66H121" fill="none" stroke="#d6e0dc" stroke-width="2"/><rect x="24" y="11" width="96" height="15" rx="2" fill="#dcece7"/><text x="36" y="43" font-size="11" fill="#55676b" font-weight="400" text-anchor="middle">1</text><rect x="51" y="30" width="36" height="17" rx="2" fill="#dcece7" stroke="#dcece7" stroke-width="2"/><text x="69" y="43" font-size="13" fill="#277a73" font-weight="700" text-anchor="middle">85</text><text x="36" y="62" font-size="11" fill="#55676b" font-weight="400" text-anchor="middle">2</text><text x="36" y="81" font-size="11" fill="#55676b" font-weight="400" text-anchor="middle">3</text><rect x="51" y="68" width="36" height="17" rx="2" fill="#dcece7" stroke="#dcece7" stroke-width="2"/><text x="69" y="81" font-size="13" fill="#277a73" font-weight="700" text-anchor="middle">78</text></g>
<text x="135" y="35" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">빈칸도 자리 유지</text>
<text x="135" y="60" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">해당 순서의 내용을 비움</text>
<text x="135" y="80" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">빈칸을 빼고 당기지 않음</text>
<path d="M18 144H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 163) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="22" y="9" width="100" height="78" rx="4" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M23 28H121M49 10V86M89 10V86M23 47H121M23 66H121" fill="none" stroke="#d6e0dc" stroke-width="2"/><rect x="24" y="11" width="96" height="15" rx="2" fill="#dcece7"/><rect x="50" y="29" width="38" height="18" rx="1" fill="#dcece7" stroke="#277a73" stroke-width="2"/><text x="68" y="43" font-size="12" fill="#277a73" font-weight="700" text-anchor="middle">A1</text><path d="M56 56H80M56 75H76" fill="none" stroke="#55676b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="179" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">수식은 결과만</text>
<text x="135" y="204" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">계산 결과 값을 입력</text>
<text x="135" y="224" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">대상의 표시 형식 유지</text>
<path d="M18 288H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(9 307) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><circle cx="72" cy="49" r="38" fill="#fff" stroke="#277a73" stroke-width="2"/><path d="M72 23V50L90 61" fill="none" stroke="#277a73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="135" y="323" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">날짜는 원래 숫자</text>
<text x="135" y="348" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">1900·1904 보정 안 함</text>
<text x="135" y="368" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">날짜 표시가 달라질 수 있음</text>
</g></svg>
