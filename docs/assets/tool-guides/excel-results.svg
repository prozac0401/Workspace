<text x="600.0" y="182" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">A의 개수가 다름</text>
<text x="600.0" y="205" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">첫 목록에 2개 더 많음</text>
<rect x="565.0" y="109" width="70" height="23" rx="10" fill="#eef4f1" stroke="#eef4f1" stroke-width="2"/>
<text x="600.0" y="125" font-size="12" fill="#277a73" font-weight="700" text-anchor="middle">+2</text>
