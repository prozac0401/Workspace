<text x="120.0" y="155" font-size="18" fill="#283f43" font-weight="700" text-anchor="middle">첫 목록</text>
<text x="120.0" y="182" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">같은 비교값 A가</text>
<text x="120.0" y="205" font-size="15" fill="#55676b" font-weight="400" text-anchor="middle">3개 들어 있음</text>
