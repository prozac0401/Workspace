<text x="120" y="35" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">필요한 파일 행 선택</text>
<text x="120" y="60" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">선택형 Excel 기능 설치</text>
<text x="120" y="80" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">새 결과표의 보이는 행</text>
<text x="120" y="100" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">선택</text>
