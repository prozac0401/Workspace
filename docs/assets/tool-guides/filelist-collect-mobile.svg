<text x="120" y="179" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">선택한 파일 복사…</text>
<text x="120" y="204" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">목적지와 개수 확인</text>
<text x="120" y="224" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">여기에 복사 클릭</text>
