<text x="120" y="323" font-size="16" fill="#2c2622" font-weight="700" text-anchor="start">새 폴더에 복사본</text>
<text x="120" y="348" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">같은 이름은 번호로 구분</text>
<text x="120" y="368" font-size="14" fill="#6e6258" font-weight="400" text-anchor="start">원본·기존 파일은 유지</text>
