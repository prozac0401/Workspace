<text x="600.0" y="18" font-size="11" fill="#8a622f" font-weight="700" text-anchor="middle">03</text>
<g transform="translate(528 25)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#ded2c4" opacity=".5"/><path d="M72 8L112 24V49Q112 75 72 91Q32 75 32 49V24Z" fill="#ece5d7" stroke="#8a622f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 48L66 63L93 34" fill="none" stroke="#8a622f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="600.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">성공 확인 후 설치</text>
