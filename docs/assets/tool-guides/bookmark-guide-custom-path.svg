<text x="360.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">기존 버전 제거</text>
<text x="360.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">0.2.3 이하 사용자 지정</text>
