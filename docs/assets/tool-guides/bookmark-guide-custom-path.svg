<text x="120.0" y="155" font-size="18" fill="#2c2622" font-weight="700" text-anchor="middle">백업 후 정상 종료</text>
<text x="120.0" y="182" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">데이터 폴더 전체 보관</text>
<text x="120.0" y="205" font-size="15" fill="#6e6258" font-weight="400" text-anchor="middle">기존 설치 경로 확인</text>
