<text x="135" y="323" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">결과 구분</text>
<text x="135" y="348" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">저장 결과 먼저 확인</text>
<text x="135" y="368" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">추가 확인 안내도 읽기</text>
</g></svg>
