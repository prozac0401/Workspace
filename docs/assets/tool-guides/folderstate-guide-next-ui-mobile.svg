<svg xmlns="http://www.w3.org/2000/svg" width="360" height="432" viewBox="0 0 360 432" role="img" aria-labelledby="title desc">
<title id="title">폴더 확인과 작업 결과</title><desc id="desc">위치를 바꾸면 먼저 새 폴더를 확인합니다. 저장 완료와 저장 뒤 다시 읽기 실패는 구분되므로 화면의 결과와 추가 안내를 함께 보세요.</desc>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<rect width="360" height="432" rx="12" fill="#fffcf7"/>
<g transform="translate(9 19) scale(.79)"><ellipse cx="72" cy="91" rx="55" ry="5" fill="#d6e0dc" opacity=".5"/><rect x="9" y="24" width="126" height="57" rx="7" fill="#fff" stroke="#277a73" stroke-width="2"/><rect x="18" y="33" width="10" height="9" rx="2" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><rect x="33" y="33" width="10" height="9" rx="2" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><rect x="48" y="33" width="10" height="9" rx="2" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><rect x="63" y="33" width="10" height="9" rx="2" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><rect x="78" y="33" width="10" height="9" rx="2" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><rect x="93" y="33" width="10" height="9" rx="2" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><rect x="108" y="33" width="10" height="9" rx="2" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><rect x="123" y="33" width="10" height="9" rx="2" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><rect x="18" y="47" width="10" height="9" rx="2" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><rect x="33" y="47" width="10" height="9" rx="2" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><rect x="48" y="47" width="10" height="9" rx="2" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><rect x="63" y="47" width="10" height="9" rx="2" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><rect x="78" y="47" width="10" height="9" rx="2" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><rect x="93" y="47" width="10" height="9" rx="2" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><rect x="108" y="47" width="10" height="9" rx="2" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><rect x="123" y="47" width="10" height="9" rx="2" fill="#eef4f1" stroke="#d6e0dc" stroke-width="2"/><rect x="36" y="63" width="70" height="10" rx="2" fill="#dcece7" stroke="#277a73" stroke-width="2"/></g>
<text x="135" y="35" font-size="16" fill="#283f43" font-weight="700" text-anchor="start">폴더 위치 변경</text>
<text x="135" y="60" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">이전 화면 정보 지워짐</text>
<text x="135" y="80" font-size="13" fill="#55676b" font-weight="400" text-anchor="start">폴더의 저장 상태는 유지</text>
<path d="M335 123V137M330 132L335 137L340 132" fill="none" stroke="#277a73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M18 144H342" fill="none" stroke="#d6e0dc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
