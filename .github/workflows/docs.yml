name: Documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', 'tools/calendar/**', 'mkdocs.yml', 'requirements-docs.txt', 'scripts/check-site.py', 'scripts/check-calendar-workflow.py', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'tools/calendar/**', 'mkdocs.yml', 'requirements-docs.txt', 'scripts/check-site.py', 'scripts/check-calendar-workflow.py', '.github/workflows/docs.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Collect KASI data, or rebuild using the existing validated data SHA'
        type: choice
        options: [collect, reuse]
        default: collect
      initialize_data:
        description: 'Approved first creation of calendar-data (collect only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('calendar-pr-{0}', github.event.pull_request.number) || 'workspace-pages-production' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: npm ci --prefix tools/calendar --ignore-scripts
      - run: npm test --prefix tools/calendar
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m pip install -r tools/calendar/requirements-test.txt
      - run: node tools/calendar/tests/make-sample.mjs
      - run: python tools/calendar/tests/inspect-xlsx.py
      - run: node tools/calendar/tests/make-sample.mjs 2028 artifacts/calendar/leap
      - run: python tools/calendar/tests/inspect-xlsx.py artifacts/calendar/leap/calendar_2028.xlsx
      - run: node tools/calendar/tests/write-fixture.mjs
      - run: python tools/calendar/tests/validate-schema.py
      - run: python scripts/check-calendar-workflow.py
      - run: python -m mkdocs build --strict
      - run: python scripts/check-site.py site
      # This local/PR site has unavailable data and is never uploaded to Pages.
  prepare-data:
    needs: verify
    if: >-
      vars.CALENDAR_ENABLED == 'true' &&
      github.repository == 'prozac0401/Workspace' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-latest
    outputs:
      persist: ${{ steps.data.outputs.persist }}
      deploy: ${{ steps.data.outputs.deploy }}
      data_sha: ${{ steps.data.outputs.data_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: source
        run: node tools/calendar/check-source.mjs
        env:
          CALENDAR_SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
          CALENDAR_SOURCE_SHA: ${{ github.sha }}
      - id: data
        if: steps.source.outputs.current == 'true'
        run: node tools/calendar/workflow-data.mjs
        env:
          CALENDAR_ACTION: ${{ github.event_name == 'push' && 'reuse' || inputs.action || 'collect' }}
          CALENDAR_INITIALIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_data && 'true' || 'false' }}
          KASI_SERVICE_KEY: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'collect')) && secrets.KASI_SERVICE_KEY || '' }}
      - uses: actions/upload-artifact@v4
        if: steps.data.outputs.persist == 'true'
        with:
          name: calendar-candidate
          path: artifacts/calendar-pipeline/candidate.json
          if-no-files-found: error
          retention-days: 1
  store-data:
    needs: prepare-data
    if: needs.prepare-data.outputs.persist == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      data_sha: ${{ steps.store.outputs.data_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: calendar-candidate
          path: artifacts/calendar-pipeline
      - id: source
        run: node tools/calendar/check-source.mjs
        env:
          CALENDAR_SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
          CALENDAR_SOURCE_SHA: ${{ github.sha }}
      - id: store
        if: steps.source.outputs.current == 'true'
        shell: bash
        env:
          EXPECTED_DATA_SHA: ${{ needs.prepare-data.outputs.data_sha }}
          INITIALIZE_DATA: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_data && 'true' || 'false' }}
        run: |
          args=(save --input artifacts/calendar-pipeline/candidate.json)
          if [[ -n "$EXPECTED_DATA_SHA" ]]; then args+=(--expected-sha "$EXPECTED_DATA_SHA"); fi
          if [[ "$INITIALIZE_DATA" == true ]]; then args+=(--initialize); fi
          node tools/calendar/data-store.mjs "${args[@]}"
  build:
    needs: [verify, prepare-data, store-data]
    if: >-
      always() && needs.verify.result == 'success' && needs.prepare-data.result == 'success' &&
      needs.prepare-data.outputs.deploy == 'true' &&
      ((needs.store-data.result == 'skipped' && needs.prepare-data.outputs.persist != 'true') ||
       (needs.store-data.result == 'success' && needs.store-data.outputs.data_sha != ''))
    runs-on: ubuntu-latest
    outputs:
      data_sha: ${{ steps.selected.outputs.data_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - id: selected
        env:
          DATA_SHA: ${{ needs.store-data.outputs.data_sha || needs.prepare-data.outputs.data_sha }}
        run: |
          node tools/calendar/data-store.mjs read --sha "$DATA_SHA" --output artifacts/calendar-pipeline/selected.json
          echo "data_sha=$DATA_SHA" >> "$GITHUB_OUTPUT"
      - run: python -m mkdocs build --strict
        env:
          CALENDAR_PRODUCTION: '1'
          CALENDAR_DATA_FILE: artifacts/calendar-pipeline/selected.json
      - run: python scripts/check-site.py site --production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    if: >-
      vars.CALENDAR_ENABLED == 'true' && github.repository == 'prozac0401/Workspace' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: source
        uses: actions/github-script@v7
        with:
          script: |
            const branch = await github.rest.repos.getBranch({ ...context.repo, branch: context.payload.repository.default_branch });
            core.setOutput('current', branch.data.commit.sha === context.sha);
      - name: Deploy documentation
        if: steps.source.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
