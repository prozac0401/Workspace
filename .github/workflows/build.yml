name: Windows build and MSI
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'installer/**', 'scripts/**', 'assets/**', 'Directory.Build.props', 'global.json', 'NuGet.Config', '.config/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'installer/**', 'scripts/**', 'assets/**', 'Directory.Build.props', 'global.json', 'NuGet.Config', '.config/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test and build MSI
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folderstate-windows-evaluation
          path: |
            artifacts/release/*
            tests/FolderState.Tests/bin/Release/net10.0/test-results.json
          if-no-files-found: warn
