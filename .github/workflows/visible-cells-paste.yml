name: VisibleCellsPaste Windows build
on:
  push:
    branches: [main]
    paths: ['tools/VisibleCellsPaste/**', 'docs/tools/visible-cells-paste/**', '.github/workflows/visible-cells-paste.yml']
  pull_request:
    paths: ['tools/VisibleCellsPaste/**', 'docs/tools/visible-cells-paste/**', '.github/workflows/visible-cells-paste.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build, test and verify standalone package
        # Package metadata inspection uses Windows PowerShell and .NET Framework.
        shell: powershell
        run: ./tools/VisibleCellsPaste/build/build.ps1
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and verify both MSI architectures
        shell: powershell
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool install wix --version 4.0.6 --tool-path .tools/wix
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC x86/x64 tools are required.' }
          $vc = Get-ChildItem "$vs/VC/Tools/MSVC" -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          ./tools/VisibleCellsPaste/build/build-msi.ps1 -VCToolsRoot $vc.FullName -WindowsSdkRoot "${env:ProgramFiles(x86)}/Windows Kits/10"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visible-cells-paste-windows-build
          path: |
            artifacts/visible-cells-paste/*/VisibleCellsPaste_*.zip
            artifacts/visible-cells-paste/*/SHA256SUMS.txt
            artifacts/visible-cells-paste/*/package/build-manifest.json
            artifacts/visible-cells-paste/*/compile-x86.log
            artifacts/visible-cells-paste/*/compile-x64.log
            artifacts/visible-cells-paste/*/compile-setup.log
            artifacts/visible-cells-paste/*/core-tests-build.log
            artifacts/visible-cells-paste/*/core-tests.log
            artifacts/visible-cells-paste/*/native-clipboard-tests-build.log
            artifacts/visible-cells-paste/*/native-clipboard-tests.log
            artifacts/visible-cells-paste/*/bulk-snapshot-tests-build.log
            artifacts/visible-cells-paste/*/bulk-snapshot-tests.log
            artifacts/visible-cells-paste/*/addin-lifecycle-tests-build.log
            artifacts/visible-cells-paste/*/addin-lifecycle-tests.log
            artifacts/visible-cells-paste/*/com-lifetime-tests-build.log
            artifacts/visible-cells-paste/*/com-lifetime-tests.log
            artifacts/visible-cells-paste/*/com-lifetime-tests-x86-build.log
            artifacts/visible-cells-paste/*/com-lifetime-tests-x86.log
            artifacts/visible-cells-paste/*/global-state-recovery-tests-build.log
            artifacts/visible-cells-paste/*/global-state-recovery-tests.log
            artifacts/visible-cells-paste/*/presentation-entry-tests-build.log
            artifacts/visible-cells-paste/*/presentation-entry-tests.log
            artifacts/visible-cells-paste/*/setup-tests-build.log
            artifacts/visible-cells-paste/*/setup-tests.log
            artifacts/visible-cells-paste/*/msi/*/*.msi
            artifacts/visible-cells-paste/*/msi/*/SHA256SUMS.txt
            artifacts/visible-cells-paste/*/msi/*/*/guard-tests.log
            artifacts/visible-cells-paste/*/msi/*/*/wix-build.log
          if-no-files-found: warn
