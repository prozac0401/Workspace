name: DownloadVersionManager Windows evaluation
on:
  push:
    branches: [main, 'codex/download-version-manager']
    paths: ['tools/DownloadVersionManager/**', 'docs/tools/download-version-manager/**', '.github/workflows/download-version-manager.yml']
  pull_request:
    paths: ['tools/DownloadVersionManager/**', 'docs/tools/download-version-manager/**', '.github/workflows/download-version-manager.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install local WiX tool
        shell: pwsh
        run: dotnet tool install wix --version 4.0.6 --tool-path .tools/wix
      - name: Build host, automatic tests and single evaluation MSI
        shell: pwsh
        run: ./tools/DownloadVersionManager/build/build.ps1 -Wix ./.tools/wix/wix.exe -LifecyclePackages
      - name: Build separate upgrade fixture
        shell: pwsh
        run: ./tools/DownloadVersionManager/build/build.ps1 -Wix ./.tools/wix/wix.exe -Version 0.1.1
      - name: Isolated native installer lifecycle
        shell: pwsh
        run: |
          $testRoot = 'artifacts/download-version-manager/0.1.0-evaluation'
          $stateFile = "$testRoot/ci-installer-results.json"
          python tools/DownloadVersionManager/tests/integration/installer.py prepare --msi "$testRoot/DownloadVersionManager-0.1.0-x64.msi" --output $stateFile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/DownloadVersionManager/tests/integration/installer.py resume --output $stateFile --upgrade artifacts/download-version-manager/0.1.1-evaluation/DownloadVersionManager-0.1.1-x64.msi --rollback "$testRoot/DownloadVersionManager-rollback-test.msi"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/DownloadVersionManager/tests/integration/presence.py --output "$testRoot/ci-installed-presence.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/DownloadVersionManager/tests/integration/installer.py cleanup --output $stateFile
          exit $LASTEXITCODE
      - name: Late installer rollback and subsequent reinstall
        shell: pwsh
        run: |
          $testRoot = 'artifacts/download-version-manager/0.1.0-evaluation'
          python tools/DownloadVersionManager/tests/integration/installer_faults.py --production "$testRoot/DownloadVersionManager-0.1.0-x64.msi" --late "$testRoot/DownloadVersionManager-late-rollback-test.msi" --postexecute "$testRoot/DownloadVersionManager-postexecute-rollback-test.msi" --output "$testRoot/ci-installer-late-fault-results.json"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: download-version-manager-evaluation
          path: |
            artifacts/download-version-manager/0.1.0-evaluation/DownloadVersionManager-0.1.0-x64.msi
            artifacts/download-version-manager/0.1.0-evaluation/SHA256SUMS.txt
            artifacts/download-version-manager/*/build-manifest.json
            artifacts/download-version-manager/*/host-results.json
            artifacts/download-version-manager/*/extension-tests.log
            artifacts/download-version-manager/*/release-gate-tests.log
            artifacts/download-version-manager/*/fixture-tests.log
            artifacts/download-version-manager/*/resource-results.json
            artifacts/download-version-manager/*/package-verification.json
            artifacts/download-version-manager/*/ci-installer-results.json
            artifacts/download-version-manager/*/ci-installed-presence.json
            artifacts/download-version-manager/*/ci-installer-late-fault-results.json
          if-no-files-found: warn
