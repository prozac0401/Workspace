name: DownloadVersionManager folder watcher
on:
  push:
    branches: [main]
    paths: ['tools/DownloadVersionManager/**', 'docs/tools/download-version-manager/**', '.github/workflows/download-version-manager.yml']
  pull_request:
    paths: ['tools/DownloadVersionManager/**', 'docs/tools/download-version-manager/**', '.github/workflows/download-version-manager.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install local WiX build tool
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: dotnet tool install wix --version 4.0.6 --tool-path "$env:GITHUB_WORKSPACE/.tools/wix"
      - name: Build watcher MSI and focused changed-path checks
        shell: pwsh
        run: ./tools/DownloadVersionManager/build/build-watcher.ps1 -Wix ./.tools/wix/wix.exe -Tests
      - uses: actions/upload-artifact@v4
        with:
          name: download-version-manager-watcher
          path: |
            artifacts/download-version-manager-watcher/0.2.1/DownloadVersionManager-Watcher-0.2.1-x64.msi
            artifacts/download-version-manager-watcher/0.2.1/SHA256SUMS.txt
            artifacts/download-version-manager-watcher/0.2.1/build-manifest.json
            artifacts/download-version-manager-watcher/0.2.1/package-verification.json
            artifacts/download-version-manager-watcher/0.2.1/*tests.log
          if-no-files-found: error
